      - name: "don"
        label: "Faire un don"
        file: "content/don.json"
        fields:
          - { label: "Accroche", name: "eyebrow", widget: "string", hint: "La petite ligne au-dessus du titre. Ex : Solidarité · Partage · Impact" }
          - { label: "Titre", name: "title", widget: "string", hint: "Un mot entre astérisques passe en or. Ex : Faites un **don**" }
          - { label: "Sous-titre", name: "soustitre", widget: "string", required: false, hint: "La phrase en gras sous le titre. Laissez vide pour ne rien afficher." }
          - { label: "Texte d'introduction", name: "intro", widget: "text" }
          - { label: "Photo du bandeau", name: "image", widget: "image", required: false, hint: "Affichée à droite du bandeau, en fondu. Format paysage, 1200 px de large au minimum." }
          - { label: "Citation du bandeau", name: "citation", widget: "string", required: false, hint: "La phrase manuscrite en bas à droite du bandeau. Les guillemets sont ajoutés tout seuls." }
          - { label: "Bouton principal - intitulé", name: "bouton", widget: "string", required: false, default: "Faire un don maintenant", hint: "Il conduit aux moyens de versement, plus bas dans la page." }
          - { label: "Second bouton - intitulé", name: "bouton2", widget: "string", required: false, hint: "Laissez vide pour masquer ce bouton." }
          - { label: "Second bouton - adresse", name: "bouton2_lien", widget: "string", required: false, default: "actualites", hint: "Ex : actualites (nos réalisations), formations, ou une adresse https://… complète." }
          - label: "Montants proposés (FCFA)"
            name: "montants"
            widget: "list"
            required: false
            field: { label: "Montant", name: "montant", widget: "number", value_type: "int", min: 1 }
            hint: "Les pastilles du panneau « Montant de votre don ». « Autre montant » est toujours ajouté à la fin. Vide : 5 000, 10 000, 25 000, 50 000 et 100 000."
          - label: "À quoi sert votre don"
            name: "usages"
            widget: "list"
            required: false
            hint: "Les quatre petites cartes sous la campagne. Vide : le bloc n'apparaît pas."
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Précision", name: "texte", widget: "string", required: false }
              - label: "Icône"
                name: "icone"
                widget: "select"
                required: false
                options:
                  - { label: "Livre (éducation)", value: "education" }
                  - { label: "Assiette (alimentation)", value: "alimentation" }
                  - { label: "Maison (hébergement)", value: "hebergement" }
                  - { label: "Cartable (fournitures)", value: "fournitures" }
                  - { label: "Trousse de secours (santé)", value: "sante" }
                  - { label: "Goutte (hygiène)", value: "hygiene" }
                  - { label: "Bus (transport)", value: "transport" }
                  - { label: "Mains (solidarité)", value: "coeur" }
          - { label: "Témoignage - texte", name: "temoignage_texte", widget: "text", required: false, hint: "Affiché en citation sous les cartes. Vide : le bloc n'apparaît pas." }
          - { label: "Témoignage - signature", name: "temoignage_auteur", widget: "string", required: false, hint: "Ex : Témoignage d'un parent bénéficiaire" }
          - { label: "Témoignage - photo", name: "temoignage_photo", widget: "image", required: false }
          - { label: "Pourquoi donner - titre", name: "pourquoi_titre", widget: "string", required: false }
          - { label: "Pourquoi donner - texte", name: "pourquoi_texte", widget: "text", required: false }
          - { label: "Pourquoi donner - intitulé du lien", name: "pourquoi_lien_label", widget: "string", required: false, hint: "Laissez vide pour masquer le lien." }
          - { label: "Pourquoi donner - adresse du lien", name: "pourquoi_lien", widget: "string", required: false, default: "actualites" }
          - { label: "Lien de paiement (Wave, PayDunya…)", name: "wave_url", widget: "string", required: false, hint: "Collez ici le lien de paiement généré depuis votre compte marchand. Le visiteur y est envoyé directement, sans étape intermédiaire. Laissez vide pour masquer le bouton." }
          - { label: "Titre du bloc de paiement", name: "wave_titre", widget: "string", required: false }
          - { label: "Texte du bloc de paiement", name: "wave_texte", widget: "text", required: false }
          - { label: "Texte du bouton de paiement", name: "wave_label", widget: "string", required: false }
          - { label: "Afficher la mention « en cours d'essai »", name: "wave_essai", widget: "boolean", default: false, required: false, hint: "À décocher le jour où le paiement n'est plus un test." }
          - { label: "Titre - Virement bancaire", name: "bank_title", widget: "string", required: false }
          - { label: "Coordonnées bancaires", name: "bank_details", widget: "markdown", hint: "Titulaire, banque, IBAN/RIB, SWIFT...", required: false }
          - { label: "Titre - Mobile Money", name: "mobile_title", widget: "string", required: false }
          - label: "Options Mobile Money"
            name: "mobile_options"
            widget: "list"
            fields:
              - { label: "Opérateur", name: "operator", widget: "string", hint: "Ex: Orange Money, Wave, Free Money…" }
              - { label: "Numéro", name: "number", widget: "string" }
              - { label: "Nom du titulaire", name: "name", widget: "string" }
          - { label: "Titre - Don en nature", name: "nature_title", widget: "string", required: false }
          - { label: "Texte - Don en nature", name: "nature_text", widget: "text", required: false }
          - { label: "Titre - Don institutionnel", name: "institution_title", widget: "string", required: false }
          - { label: "Texte - Don institutionnel", name: "institution_text", widget: "text", required: false }
          - { label: "Note de confiance (récépissé, NINEA)", name: "trust_note", widget: "string", required: false }

  - name: "reglages"
    label: "Réglages du site"
    files:

      - name: "navigation"
        label: "Navigation, Liens & pied de page"
        file: "content/navigation.json"
        fields:
          - label: "Sous-menu 'Découvrir l'AMSTC'"
            name: "nav_decouvrir"
            widget: "list"
            hint: "Liens du sous-menu 'Découvrir l'AMSTC', dans le menu du site. L'ordre ici définit l'ordre d'affichage."
            fields:
              - { label: "Texte affiché", name: "label", widget: "string" }
              - { label: "Lien", name: "href", widget: "string", hint: "Ancre de la page d'accueil (ex: #nos-actions), chemin du site (ex: actualites), ou URL complète pour un lien externe. Une faute de frappe ici casse le lien." }

          - label: "Sous-menu 'Nos activités'"
            name: "nav_activites"
            widget: "list"
            hint: "Liens du sous-menu 'Nos activités', dans le menu du site. L'ordre ici définit l'ordre d'affichage."
            fields:
              - { label: "Texte affiché", name: "label", widget: "string" }
              - { label: "Lien", name: "href", widget: "string", hint: "Ancre de la page d'accueil (ex: #nos-actions), chemin du site (ex: actualites), ou URL complète pour un lien externe. Une faute de frappe ici casse le lien." }

          - { label: "E-mail de contact (pied de page)", name: "contact_email", widget: "string", pattern: ['^[^\s@]+@[^\s@]+\.[^\s@]+$', "Adresse e-mail invalide."] }

          - { label: "Description (pied de page)", name: "footer_description", widget: "text" }
          - { label: "Numéro de récépissé", name: "recepisse", widget: "string" }
          - { label: "NINEA (pied de page)", name: "ninea", widget: "string", required: false }
          - { label: "Téléphone de contact", name: "contact_phone", widget: "string", required: false }
          - { label: "Adresse (pied de page)", name: "contact_address", widget: "string", required: false, hint: "Doit rester identique à celle des mentions légales et des documents officiels : la vérification Meta les compare." }
          - { label: "Lien Facebook", name: "lien_facebook", widget: "string", required: false }
          - { label: "Lien LinkedIn", name: "lien_linkedin", widget: "string", required: false }
          - { label: "Lien Instagram", name: "lien_instagram", widget: "string", required: false }
          - { label: "Lien YouTube", name: "lien_youtube", widget: "string", required: false }
          - { label: "Lien TikTok", name: "lien_tiktok", widget: "string", required: false }
          - { label: "Lien Telegram", name: "lien_telegram", widget: "string", required: false }

      - name: "popup-annonce"
        label: "Annonce plein écran (pop-up)"
        file: "content/popup-annonce.json"
        fields:
          - { label: "Activer l'annonce", name: "active", widget: "boolean", default: false, hint: "Une fois désactivée, plus personne ne la voit - le contenu ci-dessous reste en brouillon." }
          - { label: "Titre", name: "titre", widget: "string", required: false }
          - { label: "Message", name: "message", widget: "text", required: false, hint: "Facultatif : si l'image est l'annonce elle-même (affiche, bannière), laisser vide pour n'afficher que l'image." }
          - { label: "Image (facultative)", name: "image", widget: "image", required: false, hint: "Affichée dans ses dimensions d'origine, sans recadrage - juste réduite si besoin pour tenir dans l'écran." }
