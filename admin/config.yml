backend:
  name: github
  repo: mbadji1996-cell/site-amstc
  branch: main
  base_url: https://decap-proxy.mbadji1996.workers.dev
  auth_endpoint: auth

site_url: https://amstc.org
display_url: https://amstc.org
logo_url: /assets/logo-empile-sm.png

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: 'fr'

collections:

  - name: "accueil"
    label: "Page d'accueil"
    files:

      - name: "hero"
        label: "1. En-tête (hero)"
        file: "content/home-hero.json"
        fields:
          - { label: "Accroche (eyebrow)", name: "eyebrow", widget: "markdown", minimal: true, buttons: ["bold", "italic"] }
          - { label: "Titre principal", name: "hero_title", widget: "markdown", minimal: true, buttons: ["bold", "italic"] }
          - { label: "Sous-titre", name: "hero_subtitle", widget: "markdown" }

          - label: "Photos du diaporama (fond du hero)"
            name: "hero_slideshow"
            widget: "list"
            media_folder: "/assets"
            public_folder: "/assets"
            summary: "{{fields.image}}"
            hint: "Photos en arrière-plan du hero, 6 s chacune avec un zoom lent. Alternez une photo de groupe et une photo de soins. Format paysage, 1600 px de large au moins. Laissez vide pour utiliser les photos par défaut."
            field: { label: "Photo", name: "image", widget: "image" }

          - { label: "Cartes d'intro - accroche", name: "intro_eyebrow", widget: "string", required: false }
          - { label: "Cartes d'intro - titre", name: "intro_title", widget: "string", required: false, hint: "Mettez entre astérisques (* ou **) la partie en or : Ensemble pour un *avenir meilleur*" }
          - { label: "Cartes d'intro - sous-titre", name: "intro_subtitle", widget: "text", required: false }

          - label: "Les 3 cartes d'introduction"
            name: "intro_cards"
            widget: "list"
            fields:
              - { label: "Numéro / catégorie", name: "num", widget: "string", hint: "Ex: 01 - Identité. Le numéro va dans la pastille, le reste à côté." }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "markdown" }
              - { label: "Texte du bouton", name: "link_text", widget: "string", hint: "La flèche est ajoutée automatiquement." }
              - { label: "Lien (URL ou #ancre)", name: "link_href", widget: "string" }
              - { label: "Illustration", name: "image", widget: "image", required: false, hint: "Photo carrée, un soignant ou un membre en action. Laissez vide pour l'illustration par défaut." }

          - { label: "Accroche de la section mission", name: "mission_eyebrow", widget: "string" }
          - { label: "Titre de la section mission", name: "mission_title", widget: "string", hint: "Mettez entre astérisques (* ou **) la partie en or : autour d'une *même cause*" }
          - { label: "Mission - paragraphe 1", name: "mission_p1", widget: "markdown" }
          - { label: "Mission - paragraphe 2", name: "mission_p2", widget: "markdown" }
          - { label: "Titre du bloc emblème", name: "emblem_title", widget: "string" }

          - label: "Symbolique de l'emblème (4 points)"
            name: "emblem_items"
            widget: "list"
            fields:
              - { label: "Titre du point", name: "title", widget: "string" }
              - { label: "Texte explicatif", name: "text", widget: "markdown" }

      - name: "actions"
        label: "2. Nos actions"
        file: "content/home-actions.json"
        fields:
          - { label: "Accroche", name: "actions_eyebrow", widget: "string" }
          - { label: "Titre de la section", name: "actions_title", widget: "string", hint: "Mettez entre astérisques (* ou **) la partie en or : Le registre de nos *interventions*" }
          - { label: "Sous-titre", name: "actions_subtitle", widget: "text" }

          - label: "Liste des actions (registre)"
            name: "actions"
            widget: "list"
            hint: "L'ordre ici définit l'ordre d'affichage sur le site."
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "text", widget: "markdown" }
              - { label: "Étiquette (ex: Médical, Social, Formation)", name: "tag", widget: "string", hint: "La petite icône suit le libellé : Médical, Social ou Formation." }
              - label: "Icône"
                name: "icon"
                widget: "select"
                required: false
                hint: "Laissez vide pour la choisir d'après le titre."
                options:
                  - { label: "Stéthoscope (consultations)", value: "stethoscope" }
                  - { label: "Poste de santé (couvertures)", value: "hopital" }
                  - { label: "Goutte de sang (dons)", value: "sang" }
                  - { label: "Toque (enseignements)", value: "diplome" }
                  - { label: "Équipe (formations internes)", value: "equipe" }
                  - { label: "Cœur (solidarité)", value: "coeur" }
              - { label: "Lien (URL ou #ancre)", name: "href", widget: "string" }

      - name: "historique"
        label: "3. Notre histoire"
        file: "content/home-historique.json"
        fields:
          - { label: "Accroche", name: "history_eyebrow", widget: "string" }
          - { label: "Titre de la section", name: "history_title", widget: "string", hint: "Mettez entre astérisques (* ou **) la partie en or" }
          - { label: "Sous-titre", name: "history_subtitle", widget: "text" }

          - label: "Frise chronologique"
            name: "timeline"
            widget: "list"
            hint: "L'ordre ici définit l'ordre d'affichage sur la frise."
            fields:
              - { label: "Année(s)", name: "year", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "markdown" }

          - { label: "Accroche - Les Pionniers", name: "pioneers_title", widget: "string", default: "Les Pionniers" }
          - { label: "Titre - Les Pionniers", name: "pioneers_accroche", widget: "string", required: false, hint: "Mettez entre astérisques (* ou **) la partie en or : Des visages, une même *ambition*" }
          - { label: "Sous-titre - Les Pionniers", name: "pioneers_subtitle", widget: "string", required: false }
          - label: "Valeurs - Les Pionniers"
            name: "pioneers_valeurs"
            widget: "list"
            required: false
            hint: "Affichées sous le sous-titre avec une icône : Excellence (étoile), Solidarité (groupe), Service (pousse). Laissez vide pour les masquer."
            field: { label: "Valeur", name: "valeur", widget: "string" }
          - label: "Disposition - Les Pionniers"
            name: "pioneers_layout"
            widget: "select"
            default: "cartes"
            hint: "Détermine si les pionniers s'affichent en cartes avec photo ou en simple liste de noms."
            options:
              - { label: "Cartes avec photo", value: "cartes" }
              - { label: "Liste de noms (sans photo)", value: "liste" }
          - label: "Les Pionniers (membres fondateurs)"
            name: "pioneers"
            widget: "list"
            media_folder: "/assets/pioneers"
            public_folder: "/assets/pioneers"
            hint: "L'ordre ici définit l'ordre d'affichage sur le site. Laissez la liste vide pour masquer ce bloc."
            summary: "{{fields.name}}"
            fields:
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Nom", name: "name", widget: "string", required: false }
              - { label: "Fonction actuelle", name: "fonction", widget: "string", required: false,
                  hint: "Ex : Directeur du CHR de Kolda, ou Anesthésiste - Réanimateur." }

          - { label: "Accroche - Présidents", name: "presidents_title", widget: "string", default: "Nos Présidents" }
          - { label: "Titre - Présidents", name: "presidents_accroche", widget: "string", required: false, hint: "Mettez entre astérisques (* ou **) la partie en or : Ils ont conduit *l'association*" }
          - { label: "Sous-titre - Anciens présidents", name: "presidents_subtitle", widget: "string", required: false }
          - label: "Liste des anciens présidents"
            name: "presidents"
            widget: "list"
            hint: "Laissez la liste vide pour masquer ce bloc sur le site."
            summary: "{{fields.name}}"
            fields:
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Mandat (ex: 3e Président, 2018-2019)", name: "mandate", widget: "string" }
              - { label: "Président en exercice", name: "actuel", widget: "boolean", required: false, default: false, hint: "Cochez pour le seul président actuel : sa photo porte une couronne dorée et la mention En exercice." }

      - name: "gouvernance"
        label: "4. Organisation"
        file: "content/home-gouvernance.json"
        fields:
          - { label: "Accroche", name: "gov_eyebrow", widget: "string" }
          - { label: "Titre de la section", name: "gov_title", widget: "string", hint: "Mettez entre astérisques (* ou **) la partie en or" }
          - { label: "Sous-titre", name: "gov_subtitle", widget: "text" }

          - label: "Membres du Bureau Exécutif"
            name: "members"
            widget: "list"
            media_folder: "/assets/team"
            public_folder: "/assets/team"
            hint: "Un membre par fiche. L'ordre ici définit l'ordre d'affichage sur le site."
            summary: "{{fields.name}}"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Rôle (Président, Adjoint...)", name: "role", widget: "string" }
              - { label: "Commission / groupe", name: "commission", widget: "string", hint: "Ex: Commission Médicale, Commission Communication… (une des commissions statutaires de l'association)." }
              - { label: "Précision (formation, spécialité...)", name: "detail", widget: "string", required: false }

      - name: "sections_libres"
        label: "5. Sections personnalisées"
        file: "content/home-sections-libres.json"
        fields:
          - label: "Blocs (affichés entre 'Organisation' et 'Réalisations')"
            name: "sections"
            widget: "list"
            hint: "Ajoutez un bloc et choisissez son type (texte+image, bandeau, grille de cartes, galerie). L'ordre ici définit l'ordre d'affichage."
            types:
              - label: "Texte + image"
                name: "texte_image"
                widget: "object"
                fields:
                  - { label: "Accroche", name: "eyebrow", widget: "string", required: false }
                  - { label: "Titre", name: "title", widget: "string", required: false }
                  - { label: "Texte", name: "text", widget: "markdown" }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Position de l'image", name: "image_position", widget: "select", options: ["droite", "gauche"], default: "droite" }

              - label: "Bandeau / citation"
                name: "bandeau"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string", required: false }
                  - { label: "Texte", name: "text", widget: "markdown" }
                  - { label: "Style", name: "style", widget: "select", options: ["vert", "or", "clair"], default: "vert" }
                  - { label: "Texte du bouton", name: "button_text", widget: "string", required: false }
                  - { label: "Lien du bouton", name: "button_href", widget: "string", required: false }

              - label: "Grille de cartes"
                name: "cartes"
                widget: "object"
                fields:
                  - { label: "Titre de la section", name: "title", widget: "string", required: false }
                  - label: "Cartes"
                    name: "items"
                    widget: "list"
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Image", name: "image", widget: "image", required: false }
                      - { label: "Titre", name: "title", widget: "string" }
                      - { label: "Texte", name: "text", widget: "markdown" }

              - label: "Galerie photos"
                name: "galerie"
                widget: "object"
                fields:
                  - { label: "Titre de la section", name: "title", widget: "string", required: false }
                  - label: "Images"
                    name: "images"
                    widget: "list"
                    summary: "{{fields.image}}"
                    fields:
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Légende", name: "caption", widget: "string", required: false }

      - name: "actualites_section"
        label: "6. Nos récentes activités"
        file: "content/home-actualites.json"
        fields:
          - { label: "Accroche", name: "actus_eyebrow", widget: "string", default: "Activités" }
          - { label: "Titre de la section", name: "actus_title", widget: "string", default: "Nos récentes *activités*", hint: "Mettez entre astérisques (* ou **) la partie en or. Les 3 cartes affichent automatiquement les dernières réalisations et formations, avec leur image de couverture." }
          - { label: "Sous-titre", name: "actus_subtitle", widget: "string", required: false }

      - name: "cta_footer"
        label: "7. Bandeau de mise en avant"
        file: "content/home-cta-footer.json"
        fields:
          - { label: "Titre du bandeau", name: "cta_title", widget: "string", hint: "Partie en or entre astérisques (* ou **). Le grand bandeau illustré en bas de la page d'accueil, juste avant le pied de page. Son contenu est libre : plateforme, campagne, appel aux dons…" }
          - { label: "Texte du bandeau", name: "cta_text", widget: "text" }
          - { label: "Texte du bouton du bandeau", name: "cta_button_text", widget: "string", required: false, default: "Accéder à l'espace consultation" }
          - { label: "Lien du bouton du bandeau", name: "cta_button_href", widget: "string", required: false, hint: "URL complète (externe) ou #ancre interne à la page d'accueil.", default: "https://consultations-amstc.org" }
          - { label: "Image de fond du bandeau", name: "cta_bg_image", widget: "image", required: false, hint: "Photo affichée en arrière-plan du bandeau. Conserver un format paysage." }

      - name: "mediatheque"
        label: "8. Médiathèque"
        file: "content/mediatheque.json"
        fields:
          - { label: "Accroche", name: "media_eyebrow", widget: "string" }
          - { label: "Titre de la section", name: "media_title", widget: "string", hint: "Mettez entre astérisques (* ou **) la partie en or" }
          - { label: "Sous-titre", name: "media_subtitle", widget: "text" }
          - label: "Dossiers par année"
            name: "media_years"
            widget: "list"
            hint: "Un dossier par année. L'ordre ici définit l'ordre des onglets affichés sur le site."
            fields:
              - { label: "Année", name: "year", widget: "string" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.image}}  {{fields.legende}}"
                hint: "Les 7 premières forment la mosaïque (la 1re en grand) ; les suivantes s'affichent avec « Voir les N photos »."
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Légende", name: "legende", widget: "string", required: false, hint: "Facultatif. Ex : Consultation au daara de Ndiassane, Gamou 2026. Laissez vide pour ne rien afficher." }

      - name: "prieres"
        label: "9. Heures de prière"
        file: "content/home-prieres.json"
        fields:
          - { label: "Accroche", name: "prayer_eyebrow", widget: "string", default: "Vie spirituelle" }
          - { label: "Titre de la section", name: "prayer_title", widget: "string", default: "Heures de prière", hint: "Mettez entre astérisques (* ou **) la partie en or" }
          - { label: "Sous-titre", name: "prayer_subtitle", widget: "string", required: false }
          - { label: "Ville des horaires", name: "prayer_city", widget: "string", default: "Dakar", required: false }
          - { label: "Période (date hijri)", name: "prayer_period_hijri", widget: "string", required: false, hint: "Ex : Du 02 au 08 Safar 1448H" }
          - { label: "Période (date grégorienne)", name: "prayer_period_gregorian", widget: "string", required: false, hint: "Ex : Du vendredi 17 au jeudi 23 juillet 2026" }
          - label: "Heures de la semaine"
            name: "prayer_times"
            widget: "list"
            summary: "{{fields.label}} - {{fields.time}}"
            hint: "À mettre à jour chaque semaine. L'ordre ici définit l'ordre d'affichage."
            fields:
              - { label: "Nom de la prière", name: "label", widget: "string" }
              - { label: "Heure", name: "time", widget: "string", hint: "Ex : 05H35" }

      - name: "impact"
        label: "10. Chiffres d'impact"
        file: "content/home-impact.json"
        fields:
          - { label: "Accroche", name: "impact_eyebrow", widget: "string", default: "Notre impact" }
          - { label: "Titre de la section", name: "impact_title", widget: "string", default: "Ce que nous accomplissons ensemble", hint: "Mettez entre astérisques (* ou **) la partie en or" }
          - { label: "Sous-titre", name: "impact_subtitle", widget: "string", required: false }
          - label: "Photos de fond (diaporama)"
            name: "impact_slideshow"
            widget: "list"
            media_folder: "/assets/impact-fond"
            public_folder: "/assets/impact-fond"
            summary: "{{fields.image}}"
            hint: "Photos en fondu enchaîné derrière les chiffres, sous un voile vert. Format paysage, soignants en consultation. Environ 200 Ko par photo. Évitez les patients et les enfants reconnaissables. Laissez vide pour utiliser les photos par défaut."
            field: { label: "Photo", name: "image", widget: "image" }
          - label: "Chiffres clés"
            name: "impact_stats"
            widget: "list"
            summary: "{{fields.number}} - {{fields.label}}"
            hint: "4 chiffres maximum recommandés pour rester lisible. Laissez le nombre vide pour masquer une tuile."
            fields:
              - { label: "Nombre", name: "number", widget: "string", required: false, hint: "Ex : 500+, 1 200, 15…" }
              - { label: "Libellé", name: "label", widget: "string" }
              - label: "Icône"
                name: "icon"
                widget: "select"
                default: "stethoscope"
                options:
                  - { label: "Stéthoscope (santé)", value: "stethoscope" }
                  - { label: "Goutte de sang (don de sang)", value: "droplet" }
                  - { label: "Groupe de personnes (membres)", value: "users" }
                  - { label: "Livre (formation / daara)", value: "book" }
                  - { label: "Cœur (social / entraide)", value: "heart" }
                  - { label: "Maison (daara / terrain)", value: "home" }
                  - { label: "Calendrier (activités / événements)", value: "calendar-event" }
                  - { label: "Étoile (récompense / qualité)", value: "star" }

      - name: "temoignages"
        label: "11. Témoignages"
        file: "content/home-temoignages.json"
        fields:
          - { label: "Accroche", name: "temoignages_eyebrow", widget: "string", default: "Témoignages" }
          - { label: "Titre de la section", name: "temoignages_title", widget: "string", default: "Ce qu'ils en disent", hint: "Mettez entre astérisques (* ou **) la partie en or" }
          - { label: "Sous-titre", name: "temoignages_subtitle", widget: "string", required: false }
          - label: "Témoignages"
            name: "temoignages_list"
            widget: "list"
            summary: "{{fields.author_name}} - {{fields.quote}}"
            hint: "Recueillez toujours l'accord de la personne avant de publier son témoignage."
            fields:
              - { label: "Citation", name: "quote", widget: "text", hint: "Le témoignage tel quel, sans les guillemets." }
              - { label: "Nom", name: "author_name", widget: "string" }
              - { label: "Rôle / contexte", name: "author_role", widget: "string", required: false, hint: "Ex : Bénéficiaire, Daara Serigne Mor Diop ou Membre depuis 2021" }
              - label: "Type"
                name: "author_type"
                widget: "select"
                default: "membre"
                options:
                  - { label: "Bénéficiaire", value: "beneficiaire" }
                  - { label: "Membre", value: "membre" }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "espace_membres"
    label: "Espace membres"
    files:

      - name: "espace_membre"
        label: "Tableau de bord"
        file: "content/espace-membre.json"
        fields:
          - { label: "Accroche au-dessus du titre", name: "accroche", widget: "string", required: false, default: "Espace Membres" }
          - { label: "Salutation", name: "salutation", widget: "string", required: false, default: "Bonjour", hint: "Le prénom du membre est ajouté après, suivi d'un emoji. Exemple : « Bonjour, Awa »." }
          - { label: "Texte de bienvenue", name: "texte", widget: "text", required: false }
          - { label: "Photo de la bannière", name: "image", widget: "image", required: false, hint: "Affichée à droite de la bannière, en fondu vers le vert. Format paysage, 1600 px de large au minimum." }
          - { label: "Carte d'aide - titre", name: "aide_titre", widget: "string", required: false }
          - { label: "Carte d'aide - texte", name: "aide_texte", widget: "text", required: false }
          - { label: "Carte d'aide - intitulé du bouton", name: "aide_lien_texte", widget: "string", required: false }
          - { label: "Carte d'aide - adresse du bouton", name: "aide_lien", widget: "string", required: false, hint: "Exemple : ../guide.html" }

      - name: "espace_membre_bandeaux"
        label: "Bannières des pages (espace membres)"
        file: "content/espace-membre-bandeaux.json"
        fields:
          - label: "Espace Daara"
            name: "daara"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "titre", widget: "string", required: false }
              - { label: "Sous-titre", name: "soustitre", widget: "string", required: false, hint: "Ligne verte sous le titre. Laissez vide pour ne rien afficher." }
              - { label: "Texte", name: "texte", widget: "text", required: false }
              - { label: "Bouton - intitulé", name: "bouton", widget: "string", required: false, hint: "Laissez vide pour masquer le bouton." }
              - { label: "Bouton - adresse", name: "bouton_lien", widget: "string", required: false, hint: "Exemple : ../guide" }
              - { label: "Photo du bandeau", name: "image", widget: "image", required: false, hint: "Affichée à droite, en fondu. Format paysage, 1200 px de large au minimum. Vide : la photo de la bannière du tableau de bord est reprise." }
          - label: "Enseignements Médicaux"
            name: "medical"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "titre", widget: "string", required: false }
              - { label: "Sous-titre", name: "soustitre", widget: "string", required: false, hint: "Ligne verte sous le titre. Laissez vide pour ne rien afficher." }
              - { label: "Texte", name: "texte", widget: "text", required: false }
              - { label: "Bouton - intitulé", name: "bouton", widget: "string", required: false, hint: "Laissez vide pour masquer le bouton." }
              - { label: "Bouton - adresse", name: "bouton_lien", widget: "string", required: false, hint: "Exemple : ../guide" }
              - { label: "Photo du bandeau", name: "image", widget: "image", required: false, hint: "Affichée à droite, en fondu. Format paysage, 1200 px de large au minimum. Vide : la photo de la bannière du tableau de bord est reprise." }
          - label: "Bibliothèque"
            name: "bibliotheque"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "titre", widget: "string", required: false }
              - { label: "Sous-titre", name: "soustitre", widget: "string", required: false, hint: "Ligne verte sous le titre. Laissez vide pour ne rien afficher." }
