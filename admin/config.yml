  # Événements du calendrier : activités à venir ou passées que l'on veut voir
  # figurer dans l'agenda sans forcément leur consacrer un article complet
  # (Gamou, Ndogou Social, assemblée générale, campagne à venir...).
  - name: "evenements"
    label: "Événements (calendrier)"
    label_singular: "Événement"
    folder: "content/evenements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} - {{date}}"
    fields:
      - { label: "Titre de l'activité", name: "title", widget: "string" }
      - { label: "Date de début", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Premier jour de l'activité. Pour une activité d'une seule journée, laissez la date de fin vide." }
      - { label: "Date de fin (facultatif)", name: "date_fin", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false, default: "", hint: "Dernier jour de l'activité. L'événement s'affichera alors sur toutes les cases du calendrier concernées." }
      - { label: "Lieu (facultatif)", name: "lieu", widget: "string", required: false, hint: "Ex : FMPO, UCAD - Daara de Ndiassane - Tivaouane…" }
      - { label: "Description (facultatif)", name: "excerpt", widget: "text", required: false }
      - { label: "Image (facultatif)", name: "image", widget: "image", required: false }
      - { label: "Lien (facultatif)", name: "lien", widget: "string", required: false, hint: "Vers une réalisation, une formation ou une page externe. Ex : article.html?slug=2026-01-25-nemekou-daara-louga-2026" }

  # Événement phare : bandeau compte à rebours puis suivi en direct, affiché
  # en tête de l'accueil d'amstc.org ET de consultations-amstc.org (qui lit
  # le même fichier depuis amstc.org). Les chiffres se mettent à jour en
  # publiant ce formulaire pendant l'événement : les pages ouvertes les
  # rechargent toutes seules toutes les 2 minutes.
  - name: "evenement_phare"
    label: "Événement phare (direct)"
    files:
      - name: "evenement_phare"
        label: "Compte à rebours et suivi en direct"
        file: "content/evenement-phare.json"
        fields:
          - { label: "Afficher la section", name: "actif", widget: "boolean", default: false, hint: "Décochez pour masquer entièrement le bandeau sur les deux sites." }
          - { label: "Afficher le montant collecté", name: "afficher_collecte", widget: "boolean", default: false, required: false, hint: "Ajoute une pastille « Collecté · … » alimentée par la campagne de dons active. Le montant se met à jour tout seul ; il n'y a rien à saisir. Sans campagne active, la pastille ne s'affiche pas." }
          - { label: "Titre", name: "titre", widget: "string", hint: "Ex : Caravane Nationale 2026 - Phase 1, Mbour" }
          - { label: "Sous-titre (avant l'ouverture)", name: "sous_titre", widget: "text", hint: "Ex : Ouverture le 19 août 2026. Le direct démarre ici même : gardez la page à portée de main." }
          - { label: "Image de fond (facultatif)", name: "image", widget: "image", required: false, hint: "Affichée derrière le bandeau sur les deux sites, assombrie automatiquement pour garder le texte lisible." }
          - { label: "Date et heure d'ouverture", name: "date_debut", widget: "datetime", format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", hint: "Le compte à rebours vise ce moment, puis la section passe en EN DIRECT." }
          - { label: "Date et heure de clôture", name: "date_fin", widget: "datetime", format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", hint: "Après ce moment, la section affiche le bilan final." }
          - { label: "Retirer de l'accueil le (facultatif)", name: "date_retrait", widget: "datetime", format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", required: false, default: "", hint: "Laissez vide pour un retrait automatique 7 jours après la clôture." }
          - { label: "Message de clôture", name: "message_fin", widget: "text", required: false, hint: "Affiché après la clôture, au-dessus des chiffres finaux." }
          - label: "Phases / étapes / jours"
            name: "phases"
            widget: "list"
            required: false
            summary: "{{fields.nom}} · {{fields.lieu}}"
            fields:
              # Tous facultatifs : la pastille n'affiche que ce qui est rempli
              # (nom · lieu · dates, séparés par des points médians).
              - { label: "Nom", name: "nom", widget: "string", required: false, hint: "Ex : Phase 1" }
              - { label: "Lieu", name: "lieu", widget: "string", required: false, hint: "Ex : Mbour" }
              - { label: "Dates (texte libre)", name: "dates", widget: "string", required: false, hint: "Ex : 19-24 août" }
              - { label: "Phase en cours / mise en avant", name: "en_cours", widget: "boolean", default: false }
          - { label: "Campagne consultations liée (ID)", name: "campagne_id", widget: "string", required: false, hint: "Collez l'ID de la campagne depuis consultations-amstc.org (onglet Campagnes, bouton « Copier l'ID »). Les chiffres du direct (malades consultés, âge moyen, sexes, ordonnances) viennent alors automatiquement des données de cette campagne." }
          - { label: "Lien En savoir plus (facultatif)", name: "lien", widget: "string", required: false, hint: "Ex : etape.html?slug=... ou une page externe." }
