<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem('amstc-theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="../assets/js/theme-toggle.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration - AMSTC</title>
  <link rel="icon" href="../assets/logo-horizontal-sm.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{ font-family:'Inter', sans-serif; }
    #nc-root:empty::before{
      content:"Chargement de l'administration…";
      display:block;
      padding:40px;
      font-family:'Inter', sans-serif;
      color:#465A4E;
    }
  </style>
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <!-- Version épinglée volontairement (pas de "^") : decap-cms@3.15.0, publiée le
       23/07/2026, provoque un plantage (React error #130) à l'enregistrement de
       plusieurs fiches (Témoignages, Heures de prière). 3.14.1 est la dernière
       version stable confirmée avant cette régression - ne pas repasser à une
       plage flottante sans re-tester d'abord une publication réelle. -->
  <script src="https://unpkg.com/decap-cms@3.14.1/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap');
    CMS.registerPreviewStyle('/admin/preview.css');
    CMS.init();
  </script>
  <script>
    // ===== Bouton « Importer un fichier HTML » dans la barre de Decap =====
    // Decap n'offre pas de crochet officiel pour ajouter un bouton à sa
    // barre du haut : on l'insère nous-mêmes à côté du « Nouveau… », et
    // on le repose si l'interface se redessine. Il mène à admin/importer.html,
    // qui réutilise la même session GitHub.
    new MutationObserver(function () {
      if (document.getElementById('amstc-import-html')) return;
      // La barre du haut de Decap : le premier <header>, ou à défaut le
      // conteneur des liens « Contenus / Workflow / Médias ».
      var barre = document.querySelector('header nav, header') || document.querySelector('[class*="AppHeader"]');
      if (!barre) return;
      var lien = document.createElement('a');
      lien.id = 'amstc-import-html';
      lien.href = 'importer.html';
      lien.textContent = 'Importer un fichier HTML';
      lien.title = 'Publier un article, une formation, un projet ou une étape à partir d\'une page HTML';
      lien.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:6px 14px;'
        + 'border-radius:6px;background:#17763B;color:#fff;font-weight:600;font-size:13px;text-decoration:none;'
        + 'font-family:Inter,sans-serif;white-space:nowrap;';
      barre.appendChild(lien);
    }).observe(document.body, { childList: true, subtree: true });
  </script>
  <script>
    // ===== Bouton OK sur le calendrier des champs date/heure =====
    // Le sélecteur de date de Decap (bibliothèque MUI) se ferme uniquement en
    // cliquant à côté - déroutant : on ne sait pas si la date est validée.
    // Or elle l'est dès le clic sur un jour ; ce bouton ne fait donc que
    // fermer le calendrier, mais rend la validation explicite.
    // Repose sur les classes MUI de decap-cms 3.14.1 (version épinglée
    // ci-dessus) : à re-tester si la version du CMS change un jour.
    new MutationObserver(function () {
      document.querySelectorAll('.MuiPickersLayout-root:not([data-ok-ajoute])').forEach(function (popup) {
        popup.setAttribute('data-ok-ajoute', '1');
        var ok = document.createElement('button');
        ok.type = 'button';
        ok.textContent = 'OK';
        ok.style.cssText = 'margin:8px;padding:6px 22px;border:none;border-radius:6px;'
          + 'background:#1976d2;color:#fff;font-weight:700;font-size:14px;cursor:pointer;';
        ok.addEventListener('click', function () {
          // Échap ferme le calendrier en conservant la valeur déjà écrite
          // dans le champ ; le clic-à-côté simulé sert de repli.
          popup.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          document.body.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        });
        var barre = popup.querySelector('.MuiDialogActions-root');
        if (barre) barre.appendChild(ok); else popup.appendChild(ok);
      });
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
