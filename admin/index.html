<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem('amstc-theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="../assets/js/theme-toggle.js" defer></script>
<script src="../assets/js/defilement.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration - AMSTC</title>
  <link rel="icon" href="../assets/logo-empile-sm.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{ font-family:'Inter', sans-serif; }
    #nc-root:empty::before{
      content:"Chargement de l'administration…";
      display:block;
      padding:40px;
      font-family:'Inter', sans-serif;
      color:#465A4E;
    }
  </style>
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <!-- Version épinglée volontairement (pas de "^") : decap-cms@3.15.0, publiée le
       23/07/2026, provoque un plantage (React error #130) à l'enregistrement de
       plusieurs fiches (Témoignages, Heures de prière). 3.14.1 est la dernière
       version stable confirmée avant cette régression - ne pas repasser à une
       plage flottante sans re-tester d'abord une publication réelle. -->
  <script src="../assets/vendor/decap-cms-3.14.1.js"></script>
  <script>
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap');
    CMS.registerPreviewStyle('/admin/preview.css');
    // Le reglage du CMS (config.yml) est relu a CHAQUE ouverture : sans ce
    // parametre, le navigateur gardait jusqu'a 10 minutes l'ancienne version,
    // et une modification (un champ rendu facultatif, par exemple) semblait
    // ne pas avoir pris.
    (function () {
      var l = document.createElement('link');
      l.rel = 'cms-config-url';
      l.type = 'text/yaml';
      l.href = '/admin/config.yml?v=' + Date.now();
      document.head.appendChild(l);
    })();
    CMS.init();
  </script>
  <script>
    // ===== Bouton « Importer un fichier HTML » dans la barre de Decap =====
    // Decap n'offre pas de crochet officiel pour ajouter un bouton à sa
    // barre du haut : on l'insère nous-mêmes à côté du « Nouveau… », et
    // on le repose si l'interface se redessine. Il mène à admin/importer.html,
    // qui réutilise la même session GitHub.
    new MutationObserver(function () {
      if (document.getElementById('amstc-import-html')) return;
      // La barre du haut de Decap : le premier <header>, ou à défaut le
      // conteneur des liens « Contenus / Workflow / Médias ».
      var barre = document.querySelector('header nav, header') || document.querySelector('[class*="AppHeader"]');
      if (!barre) return;
      var lien = document.createElement('a');
      lien.id = 'amstc-import-html';
      lien.href = 'importer';
      lien.textContent = 'Importer un fichier HTML';
      lien.title = 'Publier un article, une formation, un projet ou une étape à partir d\'une page HTML';
      lien.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:6px 14px;'
        + 'border-radius:6px;background:#17763B;color:#fff;font-weight:600;font-size:13px;text-decoration:none;'
        + 'font-family:Inter,sans-serif;white-space:nowrap;';
      barre.appendChild(lien);
    }).observe(document.body, { childList: true, subtree: true });
  </script>
  <script>
    // ===== Barre de recherche dans l'entete =====
    // Decap n'en propose qu'une, dans la colonne de gauche, sous le mot
    // « Collections » : une ligne grise, facile a manquer, et hors champ
    // des que la fenetre retrecit. Celle-ci vit dans la barre du haut,
    // visible partout, y compris sur telephone.
    //
    // Elle n'invente rien : elle appelle la recherche DE DECAP, par ses
    // routes #/collections/<nom>/search/<terme> et #/search/<terme>.
    // Filtrer nous-memes les cartes affichees aurait ignore les fiches
    // que la liste n'a pas encore dessinees - la moitie des realisations.
    (function () {
      var champ = null;
      var minuteur = null;

      function collection() {
        var m = /^#\/collections\/([^\/]+)/.exec(location.hash || '');
        return m ? m[1] : '';
      }
      function terme() {
        var m = /\/search\/([^\/?]+)/.exec(location.hash || '');
        try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
      }
      // « Rechercher dans Realisations… » : le nom de la collection vient
      // de son entree dans la colonne de gauche - le titre de la liste,
      // lui, disparait des qu'on affiche des resultats de recherche.
      function portee() {
        var col = collection();
        if (col) {
          var lien = document.querySelector('a[href$="/collections/' + col + '"]');
          if (lien && lien.textContent.trim()) return lien.textContent.trim();
        }
        var t = document.querySelector('[class*="CollectionTopHeading"]');
        return t && t.textContent.trim() ? t.textContent.trim() : '';
      }
      function placeholder() {
        if (!champ) return;
        var nom = portee();
        champ.placeholder = nom ? 'Rechercher dans ' + nom + '…' : 'Rechercher…';
      }

      function aller(valeur) {
        var t = (valeur || '').trim();
        var col = collection();
        var cible;
        if (!t) cible = col ? '#/collections/' + col : '#/';
        else if (col) cible = '#/collections/' + col + '/search/' + encodeURIComponent(t);
        else cible = '#/search/' + encodeURIComponent(t);
        if (location.hash === cible) return;
        // replace et non assign : une recherche tapee lettre a lettre ne
        // doit pas remplir l'historique de dix pages intermediaires.
        location.replace(cible);
      }

      function fabriquer() {
        var form = document.createElement('form');
        form.id = 'amstc-cms-recherche';
        form.setAttribute('role', 'search');
        // Largeur et non « flex-basis » : sous 800 px la barre de Decap
        // s'empile en colonne, ou une base de 260 px devient une HAUTEUR
        // de 260 px - le champ occupait alors un quart de l'ecran.
        form.style.cssText = 'display:flex;align-items:center;gap:6px;margin-left:16px;'
          + 'background:#fff;border:1px solid #dfe3e6;border-radius:6px;padding:0 10px;'
          + 'box-sizing:border-box;width:260px;max-width:100%;flex:0 0 auto;'
          + 'height:32px;min-height:32px;align-self:center;';

        var loupe = document.createElement('span');
        loupe.textContent = '\u2315';
        loupe.setAttribute('aria-hidden', 'true');
        loupe.style.cssText = 'color:#7b8391;font-size:15px;line-height:1;flex:none;';

        champ = document.createElement('input');
        champ.type = 'search';
        champ.id = 'amstc-cms-recherche-champ';
        champ.setAttribute('aria-label', 'Rechercher une fiche');
        champ.autocomplete = 'off';
        champ.style.cssText = 'border:0;outline:none;background:transparent;font-family:Inter,sans-serif;'
          + 'font-size:13px;color:#1c2027;width:100%;min-width:0;';

        champ.addEventListener('input', function () {
          clearTimeout(minuteur);
          var v = champ.value;
          // Une lettre seule ne cherche rien d'utile et fait clignoter la
          // liste : on attend deux caracteres, ou le champ vide.
          if (v.trim().length === 1) return;
          minuteur = setTimeout(function () { aller(v); }, 350);
        });
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          clearTimeout(minuteur);
          aller(champ.value);
        });
        champ.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { champ.value = ''; clearTimeout(minuteur); aller(''); }
        });

        form.appendChild(loupe);
        form.appendChild(champ);
        return form;
      }

      function poser() {
        if (document.getElementById('amstc-cms-recherche')) { placeholder(); return; }
        var barre = document.querySelector('[class*="AppHeaderContent"]')
          || document.querySelector('header nav, header');
        if (!barre) return;
        var actif = document.activeElement;
        barre.appendChild(fabriquer());
        champ.value = terme();
        placeholder();
        // Si l'on ecrivait au moment ou Decap a redessine sa barre, on
        // rend la main au champ, curseur en fin de mot.
        if (actif && actif.id === 'amstc-cms-recherche-champ') {
          champ.focus();
          champ.setSelectionRange(champ.value.length, champ.value.length);
        }
      }

      new MutationObserver(poser).observe(document.body, { childList: true, subtree: true });
      window.addEventListener('hashchange', function () {
        if (!champ) return;
        placeholder();
        // Le champ ne se recopie que si l'on n'est pas en train d'y
        // ecrire : sinon un aller-retour de route effacerait la frappe.
        if (document.activeElement !== champ) champ.value = terme();
      });
      poser();
    })();
  </script>

  <script>
    // ===== Bouton OK sur le calendrier des champs date/heure =====
    // Le sélecteur de date de Decap (bibliothèque MUI) se ferme uniquement en
    // cliquant à côté - déroutant : on ne sait pas si la date est validée.
    // Or elle l'est dès le clic sur un jour ; ce bouton ne fait donc que
    // fermer le calendrier, mais rend la validation explicite.
    // Repose sur les classes MUI de decap-cms 3.14.1 (version épinglée
    // ci-dessus) : à re-tester si la version du CMS change un jour.
    new MutationObserver(function () {
      document.querySelectorAll('.MuiPickersLayout-root:not([data-ok-ajoute])').forEach(function (popup) {
        popup.setAttribute('data-ok-ajoute', '1');
        var ok = document.createElement('button');
        ok.type = 'button';
        ok.textContent = 'OK';
        ok.style.cssText = 'margin:8px;padding:6px 22px;border:none;border-radius:6px;'
          + 'background:#1976d2;color:#fff;font-weight:700;font-size:14px;cursor:pointer;';
        ok.addEventListener('click', function () {
          // Échap ferme le calendrier en conservant la valeur déjà écrite
          // dans le champ ; le clic-à-côté simulé sert de repli.
          popup.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          document.body.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        });
        var barre = popup.querySelector('.MuiDialogActions-root');
        if (barre) barre.appendChild(ok); else popup.appendChild(ok);
      });
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
