<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root{
    --ink:#0B2E17; --green:#17763B; --green-deep:#06441C; --gold:#F8B718; --gold-deep:#AA7B11;
    --paper:#FFFFFF; --paper-alt:#ECEFE3; --white:#FFFFFF; --line:rgba(6,68,28,0.22);
    --radius:14px;
    --display:'Sora',sans-serif; --body:'Inter',-apple-system,sans-serif; --mono:'JetBrains Mono',monospace;
    --violet-light:#EFE8FB; --violet:#7C5CBF; --violet-dark:#5A3F94; --violet-deeper:#3D2A67;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.7;}
  a{color:var(--green);}

  header{padding:24px 0;border-bottom:1px solid var(--line);background:var(--green-deep);}
  .header-wrap{max-width:1400px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;}
  .logo-img{height:42px;filter:brightness(0) invert(1);}
  .signout-btn{
    font-family:var(--mono);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;
    color:rgba(255,255,255,0.7);background:none;border:1.5px solid rgba(255,255,255,0.25);border-radius:999px;
    padding:9px 18px;cursor:pointer;transition:border-color .18s ease;
  }
  .signout-btn:hover{border-color:rgba(255,255,255,0.6);}

  /* Largeur unique de l'espace membres : 1400 px, entete comme contenu -
     regle du site, y compris pour les pages de lecture. */
  .wrap{max-width:1400px;margin:0 auto;padding:0 28px;}
  .back{font-family:var(--mono);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-accent);display:inline-block;margin:36px 0 20px;text-decoration:none;}

  .loading,.error{color:var(--text-muted);font-family:var(--mono);font-size:0.85rem;padding:20px 0;}

  .topic-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;}
  .topic-title{font-family:var(--display);font-weight:600;color:var(--text-heading);font-size:1.5rem;margin-bottom:10px;}
  .post-meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:0.75rem;color:#8A9E8F;margin-bottom:16px;flex-wrap:wrap;}
  .post-meta strong{color:var(--violet-dark);}
  .post-body{color:var(--text-muted);white-space:pre-wrap;word-break:break-word;}
  .post-actions{display:flex;gap:14px;margin-top:16px;}
  .link-btn{background:none;border:none;font-family:var(--mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:#8A9E8F;cursor:pointer;padding:0;text-decoration:none;}
  .link-btn:hover{color:var(--violet-dark);}
  .link-btn.danger:hover{color:#B23B3B;}

  .replies-label{font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-accent);margin:28px 0 14px;}
  .reply-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:12px;}

  textarea,input[type=text]{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--body);font-size:0.92rem;color:var(--ink);background:var(--paper);resize:vertical;}
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--violet);}
  textarea{min-height:90px;}

  .reply-form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:22px 0 60px;}
  .reply-form-card label{font-family:var(--mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-accent);display:block;margin-bottom:8px;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:0.88rem;padding:11px 20px;border-radius:999px;border:none;cursor:pointer;transition:all .18s;}
  .btn-primary{background:var(--violet-dark);color:var(--white);}
  .btn-primary:hover{background:var(--violet-deeper);}
  .btn-outline{background:transparent;color:var(--text-muted);border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--violet);color:var(--violet-dark);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .form-actions{display:flex;gap:10px;align-items:center;margin-top:14px;}
  .form-msg{font-size:0.85rem;}
  .form-msg.error{color:#B23B3B;}

  .edit-box{margin-top:10px;}


  /* ===== Mise en page : discussion a gauche, reperes a droite ===== */
  .fs-page{display:grid; grid-template-columns:minmax(0,1fr); gap:16px; margin:20px 0 40px; align-items:start;}
  @media(min-width:1200px){ .fs-page{grid-template-columns:minmax(0,1fr) 300px;} }
  .fs-principal{min-width:0; display:flex; flex-direction:column; gap:14px;}

  /* ===== En-tete de la discussion ===== */
  .fs-tete{position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--line);
    background:linear-gradient(110deg, #EDF4EE 0%, #F4F8F4 60%, rgba(244,248,244,0) 100%), var(--surface);
    padding:22px 24px; display:flex; align-items:flex-start; gap:16px;}
  :root[data-theme="dark"] .fs-tete{background:linear-gradient(110deg, rgba(23,118,59,0.2) 0%, rgba(6,68,28,0.16) 60%, rgba(6,68,28,0) 100%), var(--surface);}
  .fs-tete-ic{width:56px; height:56px; flex:none; border-radius:50%; display:grid; place-items:center;
    background:var(--green-deep); color:var(--gold); font-size:25px;}
  .fs-tete-corps{min-width:0; flex:1;}
  .fs-titre{font-family:var(--display); font-size:clamp(1.3rem,2.6vw,1.7rem); font-weight:700;
    color:var(--text-heading); line-height:1.2; margin:0;}
  .fs-tete-bas{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:10px;
    font-size:0.82rem; color:var(--text-muted);}
  .fs-tete-bas span{display:inline-flex; align-items:center; gap:6px;}
  .fs-etiq{display:inline-flex; align-items:center; gap:6px; font-size:0.74rem; font-weight:600;
    padding:4px 11px; border-radius:999px; background:rgba(23,118,59,0.12); color:#12622F;}
  :root[data-theme="dark"] .fs-etiq{background:rgba(127,217,160,0.16); color:#7FD9A0;}

  /* ===== Messages ===== */
  .fs-message{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px;}
  .fs-message.auteur{background:linear-gradient(180deg, rgba(23,118,59,0.05) 0%, var(--surface) 60%);}
  .fs-msg-tete{display:flex; align-items:flex-start; gap:12px; margin-bottom:12px;}
  .fs-avatar{width:46px; height:46px; flex:none; border-radius:50%; object-fit:cover; background:var(--paper-alt);}
  .fs-avatar-vide{width:46px; height:46px; flex:none; border-radius:50%; display:grid; place-items:center;
    background:rgba(23,118,59,0.1); color:var(--green); font-family:var(--display); font-weight:700; font-size:0.95rem;}
  .fs-msg-nom{font-family:var(--display); font-weight:700; color:var(--text-heading); font-size:0.98rem;
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .fs-badge{font-size:0.68rem; font-weight:600; padding:3px 9px; border-radius:999px;
    background:rgba(23,118,59,0.12); color:#12622F;}
  :root[data-theme="dark"] .fs-badge{background:rgba(127,217,160,0.16); color:#7FD9A0;}
  .fs-badge.or{background:rgba(248,183,24,0.22); color:#6B4B07;}
  :root[data-theme="dark"] .fs-badge.or{background:rgba(248,183,24,0.16); color:#F0C955;}
  .fs-msg-sous{font-size:0.78rem; color:var(--text-muted);}
  .fs-msg-date{margin-left:auto; flex:none; font-family:var(--mono); font-size:0.72rem; color:var(--text-muted);
    display:inline-flex; align-items:center; gap:6px;}
  .fs-msg-corps{white-space:pre-wrap; color:var(--ink); font-size:0.94rem; line-height:1.6;}
  .fs-msg-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .fs-action{display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--text-heading);
    font-family:var(--body); font-size:0.82rem; font-weight:600;}
  .fs-action:hover{border-color:var(--green); color:var(--green);}
  .fs-action.aime{background:rgba(23,118,59,0.1); border-color:rgba(23,118,59,0.3); color:#12622F;}
  :root[data-theme="dark"] .fs-action.aime{background:rgba(127,217,160,0.14); border-color:rgba(127,217,160,0.3); color:#7FD9A0;}
  .fs-action.danger:hover{border-color:#C0392B; color:#C0392B;}

  /* ===== Zone de reponse ===== */
  .fs-repondre{display:flex; align-items:flex-start; gap:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; padding:16px 18px;}
  .fs-repondre textarea{flex:1; min-height:90px; padding:12px 14px; border:1.5px solid var(--line);
    border-radius:12px; font-family:var(--body); font-size:0.92rem; background:var(--surface); color:var(--ink); resize:vertical;}
  .fs-repondre textarea:focus{outline:none; border-color:var(--green);}
  .fs-repondre-bas{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .fs-repondre-bas .btn{margin-left:auto;}

  /* ===== Colonne de droite ===== */
  .fs-cote{display:grid; gap:14px;}
  @media(min-width:1200px){ .fs-cote{position:sticky; top:16px;} }
  @media(max-width:1199px){ .fs-cote{order:3;} }
  .fs-carte{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 20px;}
  .fs-carte-titre{display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:0.96rem;
    font-weight:700; color:var(--text-heading); margin-bottom:12px;}
  .fs-carte-titre .ti{color:var(--green);}
  .fs-fait{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .fs-fait:last-child{border-bottom:0; padding-bottom:0;}
  .fs-fait .ti{color:var(--text-accent); font-size:18px; margin-top:2px;}
  .fs-fait-label{font-size:0.76rem; color:var(--text-muted);}
  .fs-fait-valeur{font-size:0.88rem; font-weight:600; color:var(--text-heading);}
  .fs-similaire{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
  .fs-similaire:first-of-type{border-top:0;}
  .fs-similaire-ic{width:32px; height:32px; flex:none; border-radius:10px; display:grid; place-items:center;
    background:rgba(23,118,59,0.1); color:var(--green); font-size:15px;}
  .fs-similaire-titre{font-size:0.85rem; font-weight:600; color:var(--text-heading); line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .fs-similaire-meta{font-family:var(--mono); font-size:0.68rem; color:var(--text-muted);}
  .fs-similaire .ti-chevron-right{margin-left:auto; color:var(--text-muted); font-size:16px;}
  .fs-idee{background:linear-gradient(180deg, rgba(248,183,24,0.12) 0%, var(--surface) 100%);
    border-color:rgba(248,183,24,0.4);}
  .fs-idee-ic{width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:rgba(248,183,24,0.25); color:#8A6209; font-size:20px; margin-bottom:10px;}
  :root[data-theme="dark"] .fs-idee-ic{color:#F0C955;}
  .fs-idee-texte{font-size:0.86rem; color:var(--text-muted); margin-bottom:14px;}

  footer{padding:40px 0;text-align:center;max-width:1400px;margin:0 auto;}
  footer a{color:var(--green);font-family:var(--mono);font-size:0.85rem;}
  /* Boutons sur couleur de rubrique, theme sombre : le fond passe en ton
     clair (member-nav.css), le texte blanc n'y tiendrait pas. */
  :root[data-theme="dark"] .btn-primary{color:#06280F;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
  const topicId = new URLSearchParams(location.search).get('id');
  let currentProfile = null, isAdmin = false, currentTopic = null, vueComptee = false;

  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function timeAgo(dateStr) {
    const diffSec = Math.round((Date.now() - new Date(dateStr).getTime()) / 1000);
    if (diffSec < 60) return "à l'instant";
    const diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return `il y a ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `il y a ${diffH} h`;
    const diffJ = Math.round(diffH / 24);
    if (diffJ < 30) return `il y a ${diffJ} j`;
    return new Date(dateStr).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  const CATEGORIES = {
    actualites: ['Actualités', 'ti-speakerphone'], questions: ['Questions', 'ti-help-circle'],
    idees: ['Idées & Propositions', 'ti-bulb'], temoignages: ['Témoignages', 'ti-users'],
    documents: ['Documents officiels', 'ti-file-description'], autres: ['Autres', 'ti-dots'],
  };
  function categorieDe(t){ return CATEGORIES[t && t.categorie] ? t.categorie : 'autres'; }
  function initiales(nom){
    return String(nom || 'M').split(/\s+/).filter(Boolean).slice(0, 2).map(m => m[0].toUpperCase()).join('');
  }
  function dateLongue(d){
    if (!d) return '';
    try {
      return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
        + ' à ' + new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }
  function avatar(profil, classe){
    const nom = (profil && profil.full_name) || 'Membre';
    return (profil && profil.photo_url)
      ? `<img class="${classe}" src="${esc(profil.photo_url)}" alt="" loading="lazy">`
      : `<span class="${classe}-vide" aria-hidden="true">${esc(initiales(nom))}</span>`;
  }

  // ===== « J'aime » (phase114) =====
  // jaimeDispo reste faux tant que la table n'existe pas : le bouton ne
  // s'affiche alors nulle part, plutot que d'echouer a chaque clic.
  let jaimeDispo = false, jaimes = [];
  function compteJaime(type, id){
    return jaimes.filter(j => j.cible_type === type && String(j.cible_id) === String(id)).length;
  }
  function jaimePose(type, id){
    return jaimes.some(j => j.cible_type === type && String(j.cible_id) === String(id)
      && String(j.user_id) === String(currentProfile.id));
  }
  async function chargerJaimes(replyIds){
    const cibles = [topicId].concat(replyIds);
    const { data, error } = await supabaseClient
      .from('forum_jaime').select('cible_type, cible_id, user_id').in('cible_id', cibles);
    jaimeDispo = !error;
    jaimes = data || [];
  }
  async function basculerJaime(type, id){
    if (!jaimeDispo) return;
    const pose = jaimePose(type, id);
    if (pose) {
      await supabaseClient.from('forum_jaime').delete()
        .eq('cible_type', type).eq('cible_id', id).eq('user_id', currentProfile.id);
    } else {
      await supabaseClient.from('forum_jaime')
        .insert({ cible_type: type, cible_id: id, user_id: currentProfile.id });
    }
    await loadTopicAndReplies();
  }
  function boutonJaime(type, id){
    if (!jaimeDispo) return '';
    const n = compteJaime(type, id);
    const pose = jaimePose(type, id);
    return `<button type="button" class="fs-action ${pose ? 'aime' : ''}" onclick="basculerJaime('${esc(type)}','${esc(id)}')">
      <i class="ti ti-thumb-up${pose ? '-filled' : ''}" aria-hidden="true"></i> J'aime${n ? ' · ' + n : ''}</button>`;
  }

  function canModerate(authorId) {
    return isAdmin || (currentProfile && currentProfile.id === authorId);
  }

  async function loadTopicAndReplies() {
    const content = document.getElementById('content');
    if (!topicId) { content.innerHTML = '<p class="error">Sujet introuvable.</p>'; return; }

    const [topicRes, repliesRes] = await Promise.all([
      supabaseClient.from('forum_topics').select('*,profiles:author_id(full_name,photo_url)').eq('id', topicId).single(),
      supabaseClient.from('forum_replies').select('*,profiles:author_id(full_name,photo_url)').eq('topic_id', topicId).order('created_at', { ascending: true }),
    ]);

    if (!topicRes.data) { content.innerHTML = '<p class="error">Impossible de charger ce sujet.</p>'; return; }

    currentTopic = topicRes.data;
    const replies = repliesRes.data || [];
    document.title = currentTopic.title + ' - Forum AMSTC';

    await chargerJaimes(replies.map(r => r.id));
    // Une vue par ouverture, et une seule : sans ce garde-fou, chaque
    // « J'aime » - qui recharge la discussion - en aurait compte une de plus.
    if (!vueComptee) {
      vueComptee = true;
      supabaseClient.rpc('forum_compter_vue', { p_topic: topicId }).then(() => {}, () => {});
    }
    // Les autres sujets, pour la colonne de droite. Le forum en compte peu :
    // une seule requete suffit, et le tri se fait ici.
    let voisins = [];
    try {
      const { data } = await supabaseClient.rpc('forum_topics_list');
      voisins = (data || []).filter(t => String(t.id) !== String(topicId));
    } catch (e) { /* la colonne restera sans suggestions */ }
    const cat = categorieDe(currentTopic);
    const similaires = voisins
      .filter(t => categorieDe(t) === cat)
      .concat(voisins.filter(t => categorieDe(t) !== cat))
      .slice(0, 4);

    // Combien de messages chacun a ecrit dans CETTE discussion : « 3
    // contributions » sous le nom, comme sur la maquette.
    const contributions = {};
    [currentTopic].concat(replies).forEach(m => {
      contributions[m.author_id] = (contributions[m.author_id] || 0) + 1;
    });

    const message = (m, type, estAuteur) => {
      const nom = (m.profiles && m.profiles.full_name) || 'Membre';
      const n = contributions[m.author_id] || 1;
      return `
      <article class="fs-message ${estAuteur ? 'auteur' : ''}" id="${type === 'sujet' ? 'topicCard' : 'reply-' + m.id}">
        <div class="fs-msg-tete">
          ${avatar(m.profiles, 'fs-avatar')}
          <div style="min-width:0;">
            <p class="fs-msg-nom">${esc(nom)}
              ${estAuteur ? '<span class="fs-badge or">Auteur</span>' : '<span class="fs-badge">Membre</span>'}</p>
            <p class="fs-msg-sous">${n} contribution${n > 1 ? 's' : ''} dans cette discussion</p>
          </div>
          <span class="fs-msg-date"><i class="ti ti-calendar" aria-hidden="true"></i> ${esc(dateLongue(m.created_at))}</span>
        </div>
        <div class="fs-msg-corps" id="${type === 'sujet' ? 'topicBody' : 'replyBody-' + m.id}">${esc(m.body)}</div>
        <div class="fs-msg-actions">
          ${boutonJaime(type, m.id)}
          <button type="button" class="fs-action" onclick="viserReponse()"><i class="ti ti-message-circle-2" aria-hidden="true"></i> Répondre</button>
          ${canModerate(m.author_id) ? `
            <button type="button" class="fs-action" onclick="${type === 'sujet' ? 'startEditTopic()' : `startEditReply('${m.id}')`}"><i class="ti ti-pencil" aria-hidden="true"></i> Modifier</button>
            <button type="button" class="fs-action danger" onclick="${type === 'sujet' ? 'deleteTopic()' : `deleteReply('${m.id}')`}"><i class="ti ti-trash" aria-hidden="true"></i> Supprimer</button>` : ''}
        </div>
      </article>`;
    };

    const [libelleCat, iconeCat] = CATEGORIES[cat];
    content.innerHTML = `
      <div class="fs-page">
        <div class="fs-principal">
          <section class="fs-tete">
            <span class="fs-tete-ic" aria-hidden="true"><i class="ti ${esc(iconeCat)}"></i></span>
            <div class="fs-tete-corps">
              <h1 class="fs-titre">${esc(currentTopic.title)}</h1>
              <div class="fs-tete-bas">
                <span><i class="ti ti-user" aria-hidden="true"></i> Par ${esc(currentTopic.profiles ? currentTopic.profiles.full_name : 'Membre')}</span>
                <span><i class="ti ti-calendar" aria-hidden="true"></i> ${esc(dateLongue(currentTopic.created_at).split(' à ')[0])}</span>
                <span class="fs-etiq"><i class="ti ${esc(iconeCat)}" aria-hidden="true"></i> ${esc(libelleCat)}</span>
                ${currentTopic.vues != null ? `<span><i class="ti ti-eye" aria-hidden="true"></i> ${Number(currentTopic.vues) || 0} vue${(Number(currentTopic.vues) || 0) > 1 ? 's' : ''}</span>` : ''}
              </div>
            </div>
          </section>

          ${message(currentTopic, 'sujet', true)}
          <div id="repliesList" style="display:flex;flex-direction:column;gap:14px;">
            ${replies.map(r => message(r, 'reponse', String(r.author_id) === String(currentTopic.author_id))).join('')}
          </div>

          <div class="fs-repondre">
            ${avatar(currentProfile, 'fs-avatar')}
            <div style="flex:1;min-width:0;">
              <textarea id="replyBodyInput" placeholder="Écrivez votre réponse ici…"></textarea>
              <div class="fs-repondre-bas">
                <p class="form-msg" id="replyMsg"></p>
                <button class="btn btn-primary" id="replySubmitBtn"><i class="ti ti-send"></i> Publier</button>
              </div>
            </div>
          </div>
        </div>

        <aside class="fs-cote">
          <div class="fs-carte">
            <p class="fs-carte-titre"><i class="ti ti-info-circle" aria-hidden="true"></i> À propos de cette discussion</p>
            <div class="fs-fait"><i class="ti ti-tag" aria-hidden="true"></i>
              <div><div class="fs-fait-label">Catégorie</div><div class="fs-fait-valeur">${esc(libelleCat)}</div></div></div>
            <div class="fs-fait"><i class="ti ti-user" aria-hidden="true"></i>
              <div><div class="fs-fait-label">Créée par</div><div class="fs-fait-valeur">${esc(currentTopic.profiles ? currentTopic.profiles.full_name : 'Membre')}</div></div></div>
            <div class="fs-fait"><i class="ti ti-calendar" aria-hidden="true"></i>
              <div><div class="fs-fait-label">Date de création</div><div class="fs-fait-valeur">${esc(dateLongue(currentTopic.created_at).split(' à ')[0])}</div></div></div>
            <div class="fs-fait"><i class="ti ti-message-circle-2" aria-hidden="true"></i>
              <div><div class="fs-fait-label">Réponses</div><div class="fs-fait-valeur">${replies.length}</div></div></div>
            ${currentTopic.vues != null ? `
            <div class="fs-fait"><i class="ti ti-eye" aria-hidden="true"></i>
              <div><div class="fs-fait-label">Vues</div><div class="fs-fait-valeur">${Number(currentTopic.vues) || 0}</div></div></div>` : ''}
          </div>

          ${similaires.length ? `
          <div class="fs-carte">
            <p class="fs-carte-titre"><i class="ti ti-messages" aria-hidden="true"></i> Discussions similaires</p>
            ${similaires.map(t => `
              <a class="fs-similaire" href="forum-sujet?id=${encodeURIComponent(t.id)}">
                <span class="fs-similaire-ic" aria-hidden="true"><i class="ti ${esc(CATEGORIES[categorieDe(t)][1])}"></i></span>
                <span style="min-width:0;">
                  <span class="fs-similaire-titre">${esc(t.title)}</span>
                  <span class="fs-similaire-meta">${t.reply_count || 0} réponse${(t.reply_count || 0) > 1 ? 's' : ''} · ${esc(timeAgo(t.last_activity_at))}</span>
                </span>
                <i class="ti ti-chevron-right" aria-hidden="true"></i>
              </a>`).join('')}
          </div>` : ''}

          <div class="fs-carte fs-idee">
            <div class="fs-idee-ic" aria-hidden="true"><i class="ti ti-bulb"></i></div>
            <p class="fs-carte-titre" style="margin-bottom:6px;">Vous avez une idée ?</p>
            <p class="fs-idee-texte">Partagez-la avec la communauté pour améliorer ensemble l'AMSTC.</p>
            <a class="btn btn-primary" href="forum" style="width:100%;justify-content:center;"><i class="ti ti-plus"></i> Nouveau sujet</a>
          </div>
        </aside>
      </div>
    `;

    document.getElementById('replySubmitBtn').addEventListener('click', submitReply);
  }

  // « Répondre » sous un message amène au champ du bas : la discussion est
  // à plat, il n'y a qu'un seul endroit où écrire.
  function viserReponse(){
    const champ = document.getElementById('replyBodyInput');
    if (!champ) return;
    champ.scrollIntoView({ behavior: 'smooth', block: 'center' });
    champ.focus();
  }

  function startEditTopic() {
    const bodyEl = document.getElementById('topicBody');
    bodyEl.innerHTML = `
      <div class="edit-box">
        <textarea id="editTopicBody">${esc(currentTopic.body)}</textarea>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveTopicEdit()"><i class="ti ti-check"></i> Enregistrer</button>
          <button class="btn btn-outline" onclick="loadTopicAndReplies()">Annuler</button>
          <p class="form-msg" id="editTopicMsg"></p>
        </div>
      </div>
    `;
  }

  async function saveTopicEdit() {
    const body = document.getElementById('editTopicBody').value.trim();
    const msg = document.getElementById('editTopicMsg');
    if (!body) { msg.textContent = 'Le message ne peut pas être vide.'; msg.className = 'form-msg error'; return; }
    const { error } = await supabaseClient.from('forum_topics').update({ body, updated_at: new Date().toISOString() }).eq('id', topicId);
    if (error) { msg.textContent = 'Erreur : ' + error.message; msg.className = 'form-msg error'; return; }
    await loadTopicAndReplies();
  }

  async function deleteTopic() {
    if (!confirm('Supprimer définitivement ce sujet et toutes ses réponses ?')) return;
    const { error } = await supabaseClient.from('forum_topics').delete().eq('id', topicId);
    if (error) { alert('Erreur : ' + error.message); return; }
    window.location.href = 'forum';
  }

  function startEditReply(replyId) {
    const bodyEl = document.getElementById('replyBody-' + replyId);
    const current = bodyEl.textContent;
    bodyEl.innerHTML = `
      <div class="edit-box">
        <textarea id="editReplyBody-${replyId}">${esc(current)}</textarea>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveReplyEdit('${replyId}')"><i class="ti ti-check"></i> Enregistrer</button>
          <button class="btn btn-outline" onclick="loadTopicAndReplies()">Annuler</button>
          <p class="form-msg" id="editReplyMsg-${replyId}"></p>
        </div>
      </div>
    `;
  }

  async function saveReplyEdit(replyId) {
    const body = document.getElementById('editReplyBody-' + replyId).value.trim();
    const msg = document.getElementById('editReplyMsg-' + replyId);
    if (!body) { msg.textContent = 'La réponse ne peut pas être vide.'; msg.className = 'form-msg error'; return; }
    const { error } = await supabaseClient.from('forum_replies').update({ body, updated_at: new Date().toISOString() }).eq('id', replyId);
    if (error) { msg.textContent = 'Erreur : ' + error.message; msg.className = 'form-msg error'; return; }
    await loadTopicAndReplies();
  }

  async function deleteReply(replyId) {
    if (!confirm('Supprimer définitivement cette réponse ?')) return;
    const { error } = await supabaseClient.from('forum_replies').delete().eq('id', replyId);
    if (error) { alert('Erreur : ' + error.message); return; }
    await loadTopicAndReplies();
  }

  async function submitReply() {
    const body = document.getElementById('replyBodyInput').value.trim();
    const msg = document.getElementById('replyMsg');
    if (!body) { msg.textContent = 'Écrivez une réponse avant de publier.'; msg.className = 'form-msg error'; return; }

    const btn = document.getElementById('replySubmitBtn');
    btn.disabled = true;
    const { error } = await supabaseClient.from('forum_replies').insert({
      topic_id: topicId,
      author_id: currentProfile.id,
      body,
    });
    btn.disabled = false;

    if (error) { msg.textContent = 'Erreur : ' + error.message; msg.className = 'form-msg error'; return; }
    await loadTopicAndReplies();
  }

  (async () => {
    const profile = await requireApprovedMember('connexion');
    if (!profile) return;
    currentProfile = profile;
    isAdmin = ['admin', 'super_admin'].includes(profile.role);
    document.getElementById('signoutBtn').style.display = '';
    document.getElementById('loadingMsg').style.display = 'none';
    await loadTopicAndReplies();
  })();

  document.getElementById('signoutBtn').addEventListener('click', async () => {
    await signOut();
    window.location.href = 'connexion';
  });
</script>

</body>
</html>
