<style>
  :root{
    --ink:#0B2E17; --green:#17763B; --green-deep:#06441C; --gold:#F8B718; --gold-deep:#AA7B11;
    --paper:#F6F7F1; --paper-alt:#ECEFE3; --white:#FFFFFF; --line:rgba(6,68,28,0.14);
    --shadow:0 12px 32px rgba(6,68,28,0.10); --radius:14px;
    --display:'Sora', sans-serif; --body:'Inter', -apple-system, sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--body); color:var(--ink); background:var(--paper); line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1400px; margin:0 auto; padding:0 28px;}
  header{padding:24px 0; border-bottom:1px solid var(--line); background:var(--green-deep);}
  .header-wrap{max-width:1400px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between;}
  .logo-img{height:42px;filter:brightness(0) invert(1);}
  .signout-btn{
    font-family:var(--mono); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em;
    color:rgba(255,255,255,0.7); background:none; border:1.5px solid rgba(255,255,255,0.25); border-radius:999px;
    padding:9px 18px; cursor:pointer; transition:border-color .18s ease;
  }
  .signout-btn:hover{border-color:rgba(255,255,255,0.6);}
  .back{font-family:var(--mono); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-accent); display:inline-block; margin:36px 0 8px;}
  .eyebrow{font-family:var(--mono); font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-accent); display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .eyebrow::before{content:""; width:22px; height:1px; background:var(--gold-deep);}
  h1{font-family:var(--display); font-weight:600; color:var(--text-heading); font-size:clamp(1.7rem,4vw,2.2rem); margin-bottom:14px;}
  .intro{color:var(--text-muted); font-size:1.02rem; margin-bottom:32px;}
  .bib-section{padding:28px 0 8px;}
  .bib-section:first-child{padding-top:0;}
  .bib-section-title{font-family:var(--display);font-size:1.15rem;font-weight:700;color:var(--text-heading);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .bib-section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  /* Le sous-dossier se distingue du dossier par un décalage et un titre
     plus discret : la hiérarchie se lit sans avoir à la deviner. */
  .bib-sous-section{padding-left:16px; border-left:2px solid var(--paper-alt); margin:6px 0 14px;}
  .bib-sous-titre{font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-accent); margin-bottom:10px;}
  .bib-filtres{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:22px;}
  .bib-filtres input, .bib-filtres select{
    padding:11px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-family:var(--body); font-size:0.92rem; background:var(--surface); color:var(--ink);
  }
  .bib-filtres input{flex:1; min-width:200px;}
  .bib-filtres select{min-width:190px;}
  .bib-filtres input:focus, .bib-filtres select:focus{outline:2px solid var(--green); outline-offset:1px; border-color:var(--green);}
  .bib-compte{font-family:var(--mono); font-size:0.74rem; color:var(--text-muted); white-space:nowrap;}
  /* Grille de cartes : jusqu'a quatre par rangee sur grand ecran, moins
     a mesure que la place manque. auto-fill + minmax evite d'entretenir
     une liste de points de rupture. */
  .book-grille{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px;}
  .book-item{margin-bottom:0;}
  /* Le visionneur ouvert prend TOUTE la largeur de la grille : un PDF
     dans une colonne de 260 px serait illisible. */
  /* Le document ouvert occupe TOUTE la page : le visionneur passe en
     plein ecran par-dessus la liste, avec une barre de fermeture. Pour
     voir un autre document, on ferme d'abord - lire au milieu des
     cartes voisines genait la lecture. */
  .book-viewer.plein{position:fixed; inset:0; z-index:1200; background:var(--paper);
    display:flex; flex-direction:column; border:none; border-radius:0; margin:0; padding:0;}
  .book-viewer.plein iframe{flex:1; height:auto; min-height:0;}
  .lecteur-barre{display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 16px; background:var(--green-deep); flex-shrink:0;}
  .lecteur-barre-titre{color:#fff; font-family:var(--display); font-weight:600;
    font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lecteur-barre .btn-view{padding:8px 20px; flex-shrink:0;}
  /* La page derriere ne defile plus : seul le document repond au doigt
     ou a la molette. */
  body.lecture-ouverte{overflow:hidden;}
  .book-row{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;
    display:flex; flex-direction:column; gap:14px; height:100%;
  }
  .book-main{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; flex:1; min-width:0;}
  .book-cover{width:110px; height:150px; object-fit:cover; border-radius:8px; flex-shrink:0; background:var(--paper-alt);}
  .book-cover-placeholder{
    width:110px; height:150px; border-radius:8px; flex-shrink:0; background:var(--paper-alt);
    display:flex; align-items:center; justify-content:center; color:var(--text-accent); font-size:30px;
  }
  .book-title{overflow-wrap:anywhere;}
  .book-title{font-family:var(--display); font-weight:600; color:var(--text-heading); font-size:1.05rem;}
  .book-excerpt{color:var(--text-muted); font-size:0.92rem; margin-top:4px;}
  .book-date{font-family:var(--mono); font-size:0.75rem; color:var(--text-muted); margin-top:6px;}
  .btn-view{
    font-weight:600; font-size:0.85rem; padding:10px 20px; border-radius:999px; border:none; cursor:pointer;
    background:var(--gold); color:var(--green-deep); flex-shrink:0; transition:opacity .15s ease;
  }
  .btn-view:hover{opacity:0.88;}
  .btn-view:disabled{opacity:0.6; cursor:wait;}
  .book-viewer{
    border:1px solid var(--line); border-radius:var(--radius); margin-top:10px;
    padding-top:6px; background:var(--surface);
  }
  .book-viewer iframe{width:100%; height:75vh; border:0; display:block;}
  .book-viewer-note{
    font-family:var(--mono); font-size:0.72rem; color:var(--text-muted); text-align:center; padding:8px 0;
  }
  /* Le lien doit se voir : la regle globale a{color:inherit} le
     rendrait indistinct du texte de la note. */
  .book-viewer-note a{color:var(--text-accent); text-decoration:underline;}
  .empty, .error, .loading{color:var(--text-muted); font-family:var(--mono); font-size:0.85rem; padding:20px 0;}
  .card-status-banner{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:14px 18px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .card-status-banner.blocked{border-left-color:#C0392B;}
  .card-status-banner-text{font-size:0.87rem;color:var(--text-muted);}
  .card-status-banner-text strong{color:var(--text-heading);}
  .card-status-banner a.btn-renew-link{background:var(--gold);color:var(--green-deep);font-weight:600;font-size:0.85rem;padding:9px 18px;border-radius:999px;white-space:nowrap;}
  footer{padding:40px 0; text-align:center;}
  footer a{color:var(--green); font-family:var(--mono); font-size:0.85rem;}
</style>

<body>

<header>
  <div class="header-wrap">
    <a href="../index.html"><img src="../assets/logo-mark-sm.png" alt="AMSTC" class="logo-img"></a>
    <button class="signout-btn" id="signoutBtn" style="display:none;">Se déconnecter</button>
  </div>
</header>

<div class="wrap">
  <a class="back" href="formations.html">← Formations</a>
  <p class="eyebrow">Espace Membres - Formations & Daara</p>
  <h1><i class="ti ti-books"></i> Bibliothèque</h1>
  <p class="intro">Livres et documents réservés aux membres, consultables en ligne. Ce contenu n'est pas téléchargeable.</p>
  <noscript><p class="error">L'affichage nécessite JavaScript. Veuillez l'activer, ou nous écrire à contact@amstc.org.</p></noscript>
  <div class="card-status-banner" id="cardStatusBanner" style="display:none;"></div>
  <div class="bib-filtres" id="bibFiltres" style="display:none;">
    <input type="search" id="bibRecherche" placeholder="Rechercher un titre…" aria-label="Rechercher dans la bibliothèque">
    <select id="bibDossier" aria-label="Filtrer par dossier"></select>
    <span class="bib-compte" id="bibCompte"></span>
  </div>
  <div id="list">
    <p class="loading" id="loadingMsg">Vérification de votre accès…</p>
  </div>
</div>

<footer>
  <a href="../index.html">AMSTC - Association Médico-Sociale des Talibés Cheikh</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/lecteur-pdf.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
  const DOCUMENTS_BUCKET = "documents-reserves";
  // Chargés depuis la base : l'association crée et renomme ses dossiers
  // depuis l'écran d'administration.
  let dossiers = [];
  let tousLesLivres = [];

  async function chargerDossiers() {
    const { data, error } = await supabaseClient
      .from("bibliotheque_dossiers")
      .select("id, nom, ordre, parent_id")
      .order("ordre", { ascending: true })
      .order("nom", { ascending: true });
    // Sans dossiers - table absente, ou aucun créé - la bibliothèque
    // s'affiche quand même : tous les documents sous « Autres documents ».
    dossiers = error ? [] : (data || []);
  }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function formatDate(d){
    return d ? new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";
  }

  function renderCardStatusBanner(state) {
    const el = document.getElementById("cardStatusBanner");
    if (state === "grace") {
      el.className = "card-status-banner";
      el.innerHTML = '<p class="card-status-banner-text"><strong>Votre carte a expiré.</strong> Renouvelez avant le 1er mars pour garder l\'accès aux contenus réservés.</p><a class="btn-renew-link" href="profil.html?open=validity">Renouveler ma carte →</a>';
      el.style.display = "";
    } else if (state === "blocked") {
      el.className = "card-status-banner blocked";
      el.innerHTML = '<p class="card-status-banner-text"><strong>Accès aux contenus réservés suspendu.</strong> Votre carte est expirée depuis plus de 2 mois.</p><a class="btn-renew-link" href="profil.html?open=validity">Renouveler ma carte →</a>';
      el.style.display = "";
    } else {
      el.style.display = "none";
    }
  }

  async function loadBooks(blocked) {
    const listEl = document.getElementById("list");
    if (blocked) {
      listEl.innerHTML = '<p class="empty">Bibliothèque verrouillée le temps de renouveler votre carte.</p>';
      return;
    }
    const { data, error } = await supabaseClient.rpc("bibliotheque_documents");

    if (error) {
      // Journalisé en console pour le dépannage, mais jamais affiché tel quel :
      // les messages Postgres bruts n'ont pas de sens pour un membre.
      console.error("Bibliothèque :", error);
      listEl.innerHTML = `<p class="error">${esc(error.message && error.message.includes('Trop de requêtes') ? error.message : "Impossible de charger la bibliothèque pour le moment.")}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = '<p class="empty">Aucun livre ou document publié pour le moment.</p>';
      return;
    }

    // Les documents sont gardés en mémoire : recherche et filtre
    // s'appliquent sans relire la base, ce qui les rend instantanés et
    // ménage le limiteur de débit de bibliotheque_documents.
    tousLesLivres = data;
    remplirFiltreDossiers();
    document.getElementById("bibFiltres").style.display = "";
    afficherLivres();
  }

  // Recherche insensible à la casse et aux accents : « medecine » doit
  // trouver « Médecine », personne ne tape les accents dans une
  // recherche.
  function normaliserRecherche(s) {
    return String(s == null ? "" : s)
      .normalize("NFD")
      // Plage ECHAPPEE, jamais les caracteres eux-memes : invisibles a la
      // lecture, ils se perdent au moindre copier-coller.
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().trim();
  }

  function remplirFiltreDossiers() {
    const sel = document.getElementById("bibDossier");
    const actuel = sel.value;
    let html = '<option value="">Tous les dossiers</option>';
    dossiers.filter(d => !d.parent_id).forEach(d => {
      html += `<option value="${esc(d.id)}">${esc(d.nom)}</option>`;
      dossiers.filter(s => s.parent_id === d.id).forEach(s => {
        html += `<option value="${esc(s.id)}">&nbsp;&nbsp;&nbsp;&rsaquo; ${esc(s.nom)}</option>`;
      });
    });
    // Les documents sans dossier doivent rester atteignables : sans cette
    // entrée, un livre non classé serait invisible dès qu'un filtre est
    // posé, alors qu'il figure bien dans la bibliothèque.
    if (tousLesLivres.some(l => !l.dossier_id)) {
      html += '<option value="__sans">Autres documents</option>';
    }
    sel.innerHTML = html;
    sel.value = [...sel.options].some(o => o.value === actuel) ? actuel : "";
  }

  function livresFiltres() {
    const q = normaliserRecherche(document.getElementById("bibRecherche").value);
    const choix = document.getElementById("bibDossier").value;

    // Choisir un dossier PARENT inclut ses sous-dossiers : filtrer sur
    // « Médecine » sans voir « Cardiologie » surprendrait.
    let permis = null;
    if (choix === "__sans") {
      permis = new Set([null]);
    } else if (choix) {
      permis = new Set([choix].concat(
        dossiers.filter(d => d.parent_id === choix).map(d => d.id)));
    }

    return tousLesLivres.filter(l => {
      if (permis) {
        const cle = l.dossier_id || null;
        if (!permis.has(cle)) return false;
      }
      if (!q) return true;
      // Le nom du dossier entre dans la recherche : chercher « islam »
      // doit ramener les livres de ce dossier, même si leur titre ne
      // contient pas le mot.
      const d = dossiers.find(x => x.id === l.dossier_id);
      return normaliserRecherche(
        [l.title, l.excerpt, d && d.nom].filter(Boolean).join(" ")
      ).indexOf(q) !== -1;
    });
  }

  function afficherLivres() {
    const listEl = document.getElementById("list");
    const data = livresFiltres();
    const compte = document.getElementById("bibCompte");
    compte.textContent = data.length === tousLesLivres.length
      ? `${tousLesLivres.length} document(s)`
      : `${data.length} sur ${tousLesLivres.length}`;

    if (!data.length) {
      listEl.innerHTML = '<p class="empty">Aucun document ne correspond à cette recherche.</p>';
      return;
    }

    // Les dossiers sont créés par l'administration (phase73) : leur nom et
    // leur ordre viennent de la base, plus d'une liste écrite en dur.
    // Un document dont le dossier est INCONNU de la liste chargée est
    // rangé avec les sans-dossier, jamais ignoré : sans ce filet, une
    // liste de dossiers incomplète - requête en échec, dossier supprimé
    // entre deux chargements - le ferait disparaître de la bibliothèque
    // alors qu'il est toujours là.
    const connus = new Set(dossiers.map(d => d.id));
    const parDossier = {};
    data.forEach(book => {
      const cle = connus.has(book.dossier_id) ? book.dossier_id : "";
      (parDossier[cle] = parDossier[cle] || []).push(book);
    });

    const livresDe = (id) => parDossier[id] || [];
    const sousDossiersDe = (id) => dossiers.filter(d => d.parent_id === id);

    // Un dossier principal est affiché s'il contient des documents OU si
    // l'un de ses sous-dossiers en contient : le masquer priverait ses
    // sous-dossiers de titre.
    const groupes = dossiers
      .filter(d => !d.parent_id)
      .map(d => ({
        nom: d.nom,
        livres: livresDe(d.id),
        sous: sousDossiersDe(d.id)
                .map(s => ({ nom: s.nom, livres: livresDe(s.id) }))
                .filter(s => s.livres.length),
      }))
      .filter(g => g.livres.length || g.sous.length);

    // Un document sans dossier reste visible, rangé en fin de page : le
    // taire reviendrait à le faire disparaître de la bibliothèque parce
    // que son dossier a été supprimé.
    if (livresDe("").length) {
      groupes.push({ nom: "Autres documents", livres: livresDe(""), sous: [] });
    }

    const carte = (book) => `
            <div class="book-item" data-id="${esc(book.id)}">
              <div class="book-row">
                <div class="book-main">
                  ${book.cover_image
                    ? `<img class="book-cover" src="${esc(book.cover_image)}" alt="" loading="lazy">`
                    : `<div class="book-cover-placeholder"><i class="ti ti-book-2"></i></div>`}
                  <div>
                    <div class="book-title">${esc(book.title)}</div>
                    ${book.excerpt ? `<div class="book-excerpt">${esc(book.excerpt)}</div>` : ""}
                    <div class="book-date">${formatDate(book.created_at)}</div>
                  </div>
                </div>
                <button class="btn-view" data-path="${esc(book.file_path || "")}" data-id="${esc(book.id)}">Consulter</button>
              </div>
              <div class="book-viewer" id="viewer-${esc(book.id)}" style="display:none;"></div>
            </div>
          `;

    listEl.innerHTML = groupes.map(g => `
        <div class="bib-section">
          <p class="bib-section-title">${esc(g.nom)}</p>
          <div class="book-grille">${g.livres.map(carte).join("")}</div>
          ${g.sous.map(s => `
            <div class="bib-sous-section">
              <p class="bib-sous-titre">${esc(s.nom)}</p>
              <div class="book-grille">${s.livres.map(carte).join("")}</div>
            </div>`).join("")}
        </div>
      `).join("");

    listEl.querySelectorAll(".btn-view").forEach(btn => {
      btn.addEventListener("click", () => toggleViewer(btn));
    });
  }

  async function toggleViewer(btn) {
    const path = btn.dataset.path;
    const viewer = document.getElementById("viewer-" + btn.dataset.id);
    if (!path) { alert("Aucun fichier associé à ce contenu."); return; }

    const isOpen = viewer.style.display !== "none";
    if (isOpen) {
      viewer.style.display = "none";
      viewer.innerHTML = "";
      viewer.classList.remove("plein");
      document.body.classList.remove("lecture-ouverte");
      btn.textContent = "Consulter";
      return;
    }

    // L'onglet est réservé AVANT l'appel réseau, sur les appareils qui en
    // ont besoin : ouvert après, Safari le bloquerait comme intempestif.
    const onglet = lecteurPreouvrirOnglet();

    btn.disabled = true;
    btn.textContent = "Préparation…";
    const { data, error } = await supabaseClient.storage
      .from(DOCUMENTS_BUCKET)
      .createSignedUrl(path, 120);
    btn.disabled = false;

    if (error || !data) {
      if (onglet) onglet.close();
      btn.textContent = "Consulter";
      alert("Impossible d'afficher ce contenu.");
      return;
    }

    lecteurAfficherPdf(viewer, data.signedUrl, onglet, "book-viewer-note");
    viewer.classList.add("plein");
    document.body.classList.add("lecture-ouverte");
    // La barre porte le titre et le seul moyen evident de revenir : en
    // plein ecran, le bouton de la carte n'est plus accessible.
    const titreDoc = btn.closest(".book-item").querySelector(".book-title").textContent;
    viewer.insertAdjacentHTML("afterbegin",
      `<div class="lecteur-barre"><span class="lecteur-barre-titre">${esc(titreDoc)}</span>`
      + `<button type="button" class="btn-view lecteur-fermer">Fermer</button></div>`);
    viewer.querySelector(".lecteur-fermer").addEventListener("click", () => toggleViewer(btn));
    btn.textContent = "Fermer";
  }

  (async () => {
    const result = await requireActiveMember("connexion.html");
    if (!result) return;
    document.getElementById("signoutBtn").style.display = "";
    document.getElementById("loadingMsg").style.display = "none";
    renderCardStatusBanner(result.state);
    // Les dossiers d'abord : le rendu des livres s'appuie sur leur nom et
    // leur ordre.
    await chargerDossiers();
    loadBooks(result.state === "blocked");
  })();

  // Les champs sont statiques : les écouteurs se posent une fois, avant
  // même que les données n'arrivent.
  document.getElementById("bibRecherche").addEventListener("input", afficherLivres);
  document.getElementById("bibDossier").addEventListener("change", afficherLivres);

  document.getElementById("signoutBtn").addEventListener("click", async () => {
    await signOut();
    window.location.href = "connexion.html";
  });

  // Echap ferme le document en lecture, comme on l'attend d'un plein
  // ecran.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const fermer = document.querySelector(".lecteur-fermer");
    if (fermer) fermer.click();
  });
</script>

</body>
</html>
