name: Build content index

on:
  push:
    branches: [main]
    paths:
      - 'content/actualites/**.md'
      - 'content/formations/**.md'
      - 'content/projets/**.md'
      - 'content/etapes/**.md'
      - 'content/evenements/**.md'
      - 'scripts/build-pages-partage.js'
  # Les cours du Daara vivent dans Supabase, pas dans le dépôt : aucun push
  # ne signale leur publication. Un passage HORAIRE leur crée leur page
  # d'aperçu - quotidien, un cours publié le matin restait sans aperçu de
  # partage jusqu'au lendemain, et les liens envoyés entre-temps
  # n'affichaient aucun titre. « Run workflow » permet de ne pas attendre.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index files
        run: node scripts/build-content-index.js

      - name: Build sitemap
        run: node scripts/build-sitemap.js

      - name: Build partage preview pages
        run: node scripts/build-pages-partage.js

      # Signale les nouveautes pour la chaine Telegram. Placee APRES les
      # pages d'apercu : le lien annonce doit deja exister, sinon Telegram
      # afficherait une carte vide. Sans les secrets, le script ne fait
      # rien et sort en succes - la construction du site ne depend pas de
      # Telegram.
      #
      # TELEGRAM_CHAT_ID est le salon d'administration : avec lui, chaque
      # nouveaute y est PROPOSEE avec un bouton « Publier sur la chaine »
      # au lieu de partir directement aux abonnes. Sans lui, l'ancien
      # comportement s'applique - publication immediate sur la chaine.
      - name: Annoncer sur la chaine Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/publier-chaine.js

      - name: Commit index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/actualites-index.json content/formations-index.json content/projets-index.json content/etapes-index.json content/evenements-index.json sitemap.xml
          # L'etat des annonces deja diffusees : sans ce commit, chaque
          # passage repartirait de zero et reannoncerait tout.
          [ -f content/.chaine-publiees.json ] && git add -f content/.chaine-publiees.json
          # Un « git add » sur un dossier absent interrompt tout le job : c'est
          # ce qui a fait échouer la première construction, avant que les
          # pages de cours n'existent. On n'ajoute que ce qui est là.
          for d in a f p e c; do [ -d "$d" ] && git add -A "$d"; done
          git diff --cached --quiet || git commit -m "chore: rebuild content index, sitemap et pages de partage"
          git push
