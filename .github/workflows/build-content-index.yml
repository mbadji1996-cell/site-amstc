name: Build content index

on:
  push:
    branches: [main]
    paths:
      - 'content/actualites/**.md'
      - 'content/formations/**.md'
      - 'content/projets/**.md'
      - 'content/etapes/**.md'
      - 'content/evenements/**.md'
      - 'scripts/build-pages-partage.js'
  # Les cours du Daara vivent dans Supabase, pas dans le dépôt : aucun push
  # ne signale leur publication. Un passage quotidien leur crée donc leur
  # page d'aperçu, et « Run workflow » permet de ne pas attendre.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index files
        run: node scripts/build-content-index.js

      - name: Build sitemap
        run: node scripts/build-sitemap.js

      - name: Build partage preview pages
        run: node scripts/build-pages-partage.js

      - name: Commit index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/actualites-index.json content/formations-index.json content/projets-index.json content/etapes-index.json content/evenements-index.json sitemap.xml
          # Un « git add » sur un dossier absent interrompt tout le job : c'est
          # ce qui a fait échouer la première construction, avant que les
          # pages de cours n'existent. On n'ajoute que ce qui est là.
          for d in a f p e c; do [ -d "$d" ] && git add -A "$d"; done
          git diff --cached --quiet || git commit -m "chore: rebuild content index, sitemap et pages de partage"
          git push
