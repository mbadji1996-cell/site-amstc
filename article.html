<style>
  :root{
    --ink:#0B2E17; --green:#17763B; --green-deep:#06441C; --gold:#F8B718; --gold-deep:#AA7B11;
    --paper:#FFFFFF; --line:rgba(6,68,28,0.22);
    --display:'Sora', sans-serif; --body:'Inter', -apple-system, sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--body); color:var(--ink); background:var(--paper); line-height:1.7;}
  a{color:var(--green);}
  header{padding:24px 0; border-bottom:1px solid var(--line); background:var(--green-deep);}
  .wrap{max-width:1400px; margin:0 auto; padding:0 28px;}
  .header-wrap{max-width:1400px; margin:0 auto; padding:0 28px;}
  .logo-img{height:42px;filter:brightness(0) invert(1);}
  .back{font-family:var(--mono); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-accent); display:inline-block; margin:36px 0 20px;}
  .art-date{font-family:var(--mono); font-size:0.78rem; color:var(--text-accent); text-transform:uppercase; letter-spacing:0.06em;}
  h1{font-family:var(--display); font-weight:600; color:var(--text-heading); font-size:2rem; margin:10px 0 28px;}
  /* Un contenu IMPORTÉ depuis un fichier HTML (assets/js/import-html.js)
     apporte son propre style, confiné à .html-importe ; les règles de
     la page ne doivent pas le recouvrir - #body h2 battrait
     .html-importe h2 par spécificité. */
  #body{font-size:1.12rem; line-height:1.75;}
  #body p:not(.html-importe *){color:var(--text-muted); margin-bottom:20px;}
  #body li:not(.html-importe *){margin-bottom:6px;}
  #body h2:not(.html-importe *),#body h3:not(.html-importe *){font-family:var(--display); color:var(--text-heading); margin:32px 0 12px;}
  #body h2:not(.html-importe *){font-size:1.5rem;}
  #body h3:not(.html-importe *){font-size:1.22rem;}
  /* Illustrations dans le texte : centrées, jamais plus hautes qu'un
     écran. Une diapositive carrée de 1400 px en couvrait plus d'un. */
  #body img:not(.html-importe *){display:block; max-width:min(100%, 760px); max-height:80vh; width:auto; height:auto;
    margin:8px auto 24px; border-radius:14px; border:1px solid var(--line);}
  #body ul:not(.html-importe *), #body ol:not(.html-importe *){padding-left:1.4em; margin-bottom:20px; color:var(--text-muted);}
  #body li:not(.html-importe *) strong{color:var(--text-heading);}
  #body hr:not(.html-importe *){border:0; border-top:1px solid var(--line); margin:36px 0;}
  #body blockquote:not(.html-importe *){margin:0 0 24px; padding:14px 18px; border-left:4px solid var(--gold);
    background:var(--paper-alt, #ECEFE3); border-radius:0 12px 12px 0;}
  #body blockquote:not(.html-importe *) p{margin-bottom:0;}
  #body table:not(.html-importe *){width:100%; max-width:760px; border-collapse:collapse; margin:0 0 24px; font-size:0.98rem;}
  #body th:not(.html-importe *), #body td:not(.html-importe *){padding:10px 14px; border:1px solid var(--line); text-align:left;}
  #body th:not(.html-importe *){background:var(--paper-alt, #ECEFE3); color:var(--text-heading); font-family:var(--display);}
  #body td:not(.html-importe *){color:var(--text-muted);}
  /* Réponse de quiz repliée : on la déplie d'un clic. */
  #body details:not(.html-importe *){max-width:760px; margin:-8px 0 22px; border:1px solid var(--line); border-radius:12px; padding:10px 16px;}
  #body details:not(.html-importe *) summary{cursor:pointer; font-weight:600; color:var(--green);}
  #body details[open]:not(.html-importe *) summary{margin-bottom:8px;}
  #body details:not(.html-importe *) p{margin-bottom:0;}
  /* Sur telephone, les colonnes se partagent la largeur et le texte passe
     a la ligne : le tableau depassait de 30 px. */
  @media (max-width:700px){ #body table:not(.html-importe *){font-size:0.86rem; table-layout:fixed;} #body th:not(.html-importe *), #body td:not(.html-importe *){padding:8px; overflow-wrap:anywhere;} }
  .video-embed{position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; margin-bottom:28px; background:#000;}
  .video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
</style>

<body>
<header class="barre-site" id="barreSite"></header>
<script src="assets/js/barre-site.js"></script>
<div class="lc-page">
  <noscript><p>L'affichage de cet article nécessite JavaScript. Veuillez l'activer, ou nous écrire à contact@amstc.org.</p></noscript>
  <div id="content">
    <p class="wrap" style="padding-top:40px;">Chargement…</p>
  </div>
</div>

<script src="assets/vendor/marked-15.0.12.min.js"></script>
<script src="assets/js/front-matter.js"></script>
<script src="assets/js/lecture.js"></script>
<script src="assets/vendor/purify-3.4.16.min.js"></script>
<script src="assets/js/import-html.js"></script>
<script src="assets/vendor/supabase-js-2.117.1.min.js"></script>
<script src="assets/js/supabase-client.js"></script>
<link rel="stylesheet" href="assets/css/sommaire-mobile.css">
<script>
  const REPO = "mbadji1996-cell/site-amstc";
  const FOLDER = "content/actualites";

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Lecture de l'en-tete : assets/js/front-matter.js, commune au site
  // (titres replies par le CMS, guillemets, blocs |-).
  function parseFrontMatter(raw) {
    const r = lireFrontMatter(raw);
    return { data: r.data, body: r.body };
  }

  function youtubeEmbedId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function injectArticleSchema(data, section) {
    if (!data.title) return;
    const schema = {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": data.title,
      "description": data.excerpt || undefined,
      "datePublished": data.date || undefined,
      "image": data.image ? [new URL(data.image, window.location.origin).href] : undefined,
      "articleSection": section,
      "url": window.location.href,
      "author": { "@type": "Organization", "name": "AMSTC" },
      "publisher": {
        "@type": "Organization",
        "name": "AMSTC - Association Médico-Sociale des Talibés Cheikh",
        "logo": { "@type": "ImageObject", "url": "https://amstc.org/assets/logo-horizontal-sm.png" }
      },
      "mainEntityOfPage": { "@type": "WebPage", "@id": window.location.href }
    };
    const script = document.createElement("script");
    script.type = "application/ld+json";
    script.textContent = JSON.stringify(schema);
    document.head.appendChild(script);
  }

  // Un contenu IMPORTÉ depuis un fichier HTML (assets/js/import-html.js)
  // arrive comme HTML complet, style compris, marqué par la classe
  // html-importe. Il ne passe pas par marked - qui casserait le <style> -
  // et DOMPurify reçoit les options qui laissent passer style et class.
  // Tout autre corps reste du Markdown, rendu comme avant.
  function rendreCorps(body) {
    const b = body || '';
    if (/^\s*(<style[\s>]|<div class="html-importe")/i.test(b) && typeof optionsPurifyImport === 'function') {
      return DOMPurify.sanitize(b, optionsPurifyImport());
    }
    return DOMPurify.sanitize(marked.parse(b));
  }

  // Le type d'activite de la fiche : meme liste que les pages de liste.
  const LIBELLE_CAT = {
    'atelier': ['Atelier', 'ti-tools'],
    'campagne': ['Campagne médicale', 'ti-vaccine'],
    'communication': ['Communication', 'ti-broadcast'],
    'consultations': ['Consultations', 'ti-stethoscope'],
    'cours': ['Cours', 'ti-book'],
    'don-sang': ['Don de sang', 'ti-droplet'],
    'epu': ['EPU', 'ti-presentation'],
    'gamou': ['Gamou', 'ti-building-mosque'],
    'jssci': ['Journées scientifiques', 'ti-microscope'],
    'masterclass': ['Masterclass', 'ti-school'],
    'ndogou': ['Ndogou', 'ti-bowl-spoon'],
    'partenariat': ['Partenariat', 'ti-affiliate'],
    'projet': ['Projet', 'ti-briefcase'],
    'rencontre': ['Rencontre', 'ti-users'],
    'sensibilisation': ['Sensibilisation', 'ti-speakerphone'],
    'solidarite': ['Solidarité', 'ti-heart-handshake'],
    'vie-associative': ['Vie associative', 'ti-flag'],
    'webinaire': ['Webinaire', 'ti-device-laptop'],
    'ziara': ['Ziara', 'ti-route'],
  };
  // Une fiche peut porter plusieurs activites : autant de pastilles.
  function pastillesCategories(data){
    const v = data.categories || data.categorie;
    return (Array.isArray(v) ? v : (v ? [v] : []))
      .filter(c => LIBELLE_CAT[c])
      .map(c => ({ icone: LIBELLE_CAT[c][1], texte: LIBELLE_CAT[c][0] }));
  }
  function catsDe(data){
    const v = data.categories || data.categorie;
    return (Array.isArray(v) ? v : (v ? [v] : [])).filter(c => LIBELLE_CAT[c]);
  }
  // Apres l'affichage : sommaire, fiches voisines, partage.
  function finirLecture(data, slug, prefixe, fichier, page){
    const corps = document.getElementById('body');
    if (corps && typeof lectureSommaire === 'function') {
      lectureSommaire(corps, document.getElementById('lcSommaire'));
    }
    if (typeof lectureProches === 'function') {
      lectureProches({ fichier: fichier, slug: slug, categories: catsDe(data),
        page: page, cible: document.getElementById('lcProches') });
    }
    if (corps && typeof rendreSommaireDepliant === 'function') rendreSommaireDepliant(corps);
    partageInit({ conteneur: 'partageZone', prefixe: prefixe, cle: 'slug' });
    if (typeof lectureDocument === 'function') lectureDocument();
  }

  async function loadArticle() {
    const slug = new URLSearchParams(window.location.search).get("slug");
    const content = document.getElementById("content");
    if (!slug) { content.innerHTML = "<p>Article introuvable.</p>"; return; }
    try {
      const res = await fetch(
        `https://raw.githubusercontent.com/${REPO}/main/${FOLDER}/${slug}.md`
      );
      // Un slug inconnu renvoie 404 : sans ce test, le texte brut
      // « 404: Not Found » de GitHub s'affichait comme s'il etait le
      // contenu de la page. Le lecteur doit savoir que la page n'existe
      // pas, et ou aller.
      if (!res.ok) {
        document.title = "Article introuvable - AMSTC";
        content.innerHTML = `<div class="wrap" style="padding:60px 28px;"><h1 style="font-family:var(--display);color:var(--text-heading);">Cet article n'existe pas ou plus.</h1><p style="color:var(--text-muted);margin:12px 0;">Le lien est peut-être ancien, ou le contenu a été retiré.</p><p><a href="actualites">Toutes nos réalisations &rarr;</a></p></div>`;
        return;
      }
      const raw = await res.text();
      const { data, body } = parseFrontMatter(raw);

      // ===== Réservé aux membres (phase 95) =====
      // La vignette est publique ; le corps n'est pas dans ce fichier - il
      // est en base, et ne se lit que connecté, membre approuvé. Trois
      // cas : pas connecté -> invitation à se connecter, avec retour ici ;
      // connecté mais pas approuvé -> le dire ; approuvé -> le corps.
      const reserve = /^(true|yes|oui|1)$/i.test(String(data.reserve || '').trim());
      if (reserve) {
        document.title = (data.title || "Réalisation") + " - AMSTC";
        const retour = encodeURIComponent(location.pathname.replace(/^\//, '') + location.search);
        // Ou lire ce contenu une fois l'acces actif : la fiche peut le
        // dire (champ « Lien vers le cours dans l'espace membres » du
        // CMS) ; sinon, la liste de l'espace membres.
        const lienMembres = String(data.lien_membres || '').trim() || 'membres/actualites';
        let corpsHtml = null, etat = "anonyme";
        try {
          const { data: sess } = await supabaseClient.auth.getSession();
          if (sess && sess.session) {
            etat = "connecte";
            const { data: lu, error: err } = await supabaseClient.rpc("lire_contenu_reserve", { p_slug: slug });
            const ligne = Array.isArray(lu) ? lu[0] : lu;
            if (!err && ligne && ligne.content) { corpsHtml = rendreCorps(ligne.content); etat = "lecteur"; }
          }
        } catch (e) { /* sans client Supabase : on reste sur l'invitation */ }
        const CHIPS = pastillesCategories(data).concat([{ icone: 'ti-lock', texte: 'Réservé aux membres', or: true }]);
        const VIDEO = null;
        content.innerHTML = lectureGabarit({
          badge: 'Nos réalisations', badgeIcone: 'ti-award',
          retourHref: 'actualites', retourTexte: 'Toutes nos réalisations',
          date: formatDatePeriode(data), titre: data.title || '', intro: data.excerpt || '',
          chips: CHIPS,
          image: data.image || '', videoId: VIDEO,
          document: data.document
            ? { url: data.document, nom: data.document_nom || 'Télécharger le support' }
            : null,
          avant: etat === "lecteur" ? '' : `
          <div class="reserve-porte" style="border:1.5px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:22px 24px;margin:0 0 30px;background:var(--paper-alt);">
            <p style="font-weight:600;color:var(--text-heading);margin:0 0 16px;">Réalisation réservée aux membres disposant d'un compte</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              ${etat === "connecte"
                ? `<a class="btn-reserve" href="${esc(lienMembres)}" style="display:inline-block;background:var(--green);color:#fff;font-weight:600;padding:10px 20px;border-radius:999px;text-decoration:none;">Voir la réalisation</a>`
                : `<a class="btn-reserve" href="membres/connexion?suite=${retour}" style="display:inline-block;background:var(--green);color:#fff;font-weight:600;padding:10px 20px;border-radius:999px;text-decoration:none;">Se connecter</a>
                   <a href="membres/inscription" style="display:inline-block;background:var(--paper);color:var(--green-deep);font-weight:600;padding:10px 20px;border-radius:999px;text-decoration:none;border:1.5px solid var(--line);">S'inscrire</a>`}
            </div>
          </div>`,
          corps: etat === "lecteur" ? corpsHtml : null,
          titreProches: 'Réalisations proches', lienProches: 'actualites', lienProchesTexte: 'Voir tout',
        });
        finirLecture(data, slug, 'a', 'content/actualites-index.json', 'article');
        return;
      }
      document.title = (data.title || "Article") + " - AMSTC";
      document.getElementById('canonical').setAttribute('href', window.location.href);
      document.getElementById('og-url').setAttribute('content', window.location.href);
      if (data.title) {
        document.getElementById('og-title').setAttribute('content', data.title + ' - AMSTC');
      }
      if (data.excerpt) {
        document.getElementById('og-desc').setAttribute('content', data.excerpt);
      }
      injectArticleSchema(data, "Réalisations");
      const ytId = youtubeEmbedId(data.video_youtube);
      const CHIPS = pastillesCategories(data);
      const VIDEO = ytId;
      content.innerHTML = lectureGabarit({
        badge: 'Nos réalisations', badgeIcone: 'ti-award',
        retourHref: 'actualites', retourTexte: 'Toutes nos réalisations',
        date: formatDatePeriode(data), titre: data.title || '', intro: data.excerpt || '',
        chips: CHIPS,
        image: data.image || '', videoId: VIDEO,
        document: data.document
          ? { url: data.document, nom: data.document_nom || 'Télécharger le support' }
          : null,
        avant: '',
        corps: rendreCorps(body),
        titreProches: 'Réalisations proches', lienProches: 'actualites', lienProchesTexte: 'Voir tout',
      });
      finirLecture(data, slug, 'a', 'content/actualites-index.json', 'article');
    } catch (e) {
      content.innerHTML = "<p>Impossible de charger cet article.</p>";
    }
  }
  loadArticle();
</script>
</body>
