<style>
  :root{
    --ink:#0B2E17; --green:#17763B; --green-deep:#06441C; --gold:#F8B718; --gold-deep:#AA7B11;
    --paper:#F6F7F1; --line:rgba(6,68,28,0.14);
    --display:'Sora', sans-serif; --body:'Inter', -apple-system, sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--body); color:var(--ink); background:var(--paper); line-height:1.7;}
  a{color:var(--green);}
  header{padding:24px 0; border-bottom:1px solid var(--line); background:var(--green-deep);}
  .wrap{max-width:1400px; margin:0 auto; padding:0 28px;}
  .header-wrap{max-width:1400px; margin:0 auto; padding:0 28px;}
  .logo-img{height:42px;filter:brightness(0) invert(1);}
  .back{font-family:var(--mono); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-accent); display:inline-block; margin:36px 0 20px;}
  .art-date{font-family:var(--mono); font-size:0.78rem; color:var(--text-accent); text-transform:uppercase; letter-spacing:0.06em;}
  .art-statut{
    font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--paper-alt, #ECEFE3); color:var(--text-heading); padding:4px 11px; border-radius:999px;
    display:inline-block; margin-left:10px; vertical-align:middle;
  }
  h1{font-family:var(--display); font-weight:600; color:var(--text-heading); font-size:2rem; margin:10px 0 28px;}
  /* Couverture : hauteur PLAFONNEE. En pleine largeur (1400 px), une
     affiche verticale devenait un mur ; on la montre entiere, centree, sur
     un fond neutre, sans depasser un ecran. Sur telephone, la largeur
     commande, sans plafond. */
  #cover{display:none; width:100%; max-height:520px; object-fit:contain; object-position:center;
    background:var(--paper-alt, #ECEFE3); border-radius:14px; margin-bottom:28px;}
  @media (max-width:700px){ #cover{max-height:none;} }
  /* Un contenu IMPORTÉ depuis un fichier HTML (assets/js/import-html.js)
     apporte son propre style, confiné à .html-importe ; les règles de
     la page ne doivent pas le recouvrir - #body h2 battrait
     .html-importe h2 par spécificité. */
  #body{font-size:1.12rem; line-height:1.75;}
  #body p:not(.html-importe *){color:var(--text-muted); margin-bottom:20px;}
  #body li:not(.html-importe *){margin-bottom:6px;}
  #body h2:not(.html-importe *),#body h3:not(.html-importe *){font-family:var(--display); color:var(--text-heading); margin:32px 0 12px;}
  #body h2:not(.html-importe *){font-size:1.5rem;}
  #body h3:not(.html-importe *){font-size:1.22rem;}
  .video-embed{position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; margin-bottom:28px; background:#000;}
  .video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

  /* ===== Frise des étapes ===== */
  #etapes-section{margin-top:40px;}
  #etapes-section h2{font-family:var(--display); font-size:1.3rem; color:var(--text-heading); margin-bottom:24px;}
  .etapes-timeline{position:relative;}
  .etape-item{position:relative; padding-left:44px; padding-bottom:28px;}
  .etape-item:last-child{padding-bottom:0;}
  .etape-item::before{
    content:""; position:absolute; left:11px; top:26px; bottom:0; width:2px; background:var(--line);
  }
  .etape-item:last-child::before{display:none;}
  .etape-dot{
    position:absolute; left:0; top:2px; width:24px; height:24px; border-radius:50%;
    background:var(--surface); border:2px solid var(--gold); color:var(--text-accent);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:0.7rem; font-weight:700;
  }
  .etape-card{
    display:block; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; transition:box-shadow .18s ease, transform .18s ease;
  }
  .etape-card:hover{box-shadow:0 8px 20px rgba(6,68,28,0.10); transform:translateY(-2px);}
  .etape-date{font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-accent);}
  .etape-card h3{font-family:var(--display); font-size:1.05rem; color:var(--text-heading); margin:4px 0 6px;}
  .etape-card p{color:var(--text-muted); font-size:0.92rem; margin:0;}

<body>
<header>
  <div class="header-wrap">
    <a href="index.html"><img src="assets/logo-mark-sm.png" alt="AMSTC" class="logo-img"></a>

</header>
<div class="wrap">
  <a class="back" href="projets.html">← Tous les projets</a>
  <noscript><p>L'affichage de cet article nécessite JavaScript. Veuillez l'activer, ou nous écrire à contact@amstc.org.</p></noscript>
  <div id="content">
    <p>Chargement…</p>
  </div>
  <div id="etapes-section" style="display:none;">
    <h2>Étapes du projet</h2>
    <div class="etapes-timeline" id="etapes-timeline"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="assets/js/import-html.js"></script>
<link rel="stylesheet" href="assets/css/sommaire-mobile.css">
<script>
  const REPO = "mbadji1996-cell/site-amstc";
  const FOLDER = "content/projets";

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parseFrontMatter(raw) {
    const match = raw.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);
    if (!match) return { data: {}, body: raw };
    const data = {};
    let currentKey = null;
    match[1].split(/\r?\n/).forEach(line => {
      const keyMatch = line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
      if (keyMatch) {
        currentKey = keyMatch[1].trim();
        data[currentKey] = keyMatch[2].trim().replace(/^"(.*)"$/, "$1");
      } else if (currentKey && line.trim()) {
        // Ligne de repli YAML (valeur trop longue renvoyée à la ligne par
        // Decap CMS) : on la rattache à la valeur en cours au lieu de la
        // perdre silencieusement.
        data[currentKey] = (data[currentKey] + " " + line.trim()).trim();
      }
    });
    return { data, body: match[2] };
  }

  function youtubeEmbedId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function injectArticleSchema(data, section) {
    if (!data.title) return;
    const schema = {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": data.title,
      "description": data.excerpt || undefined,
      "datePublished": data.date || undefined,
      "image": data.image ? [new URL(data.image, window.location.origin).href] : undefined,
      "articleSection": section,
      "url": window.location.href,
      "author": { "@type": "Organization", "name": "AMSTC" },
      "publisher": {
        "@type": "Organization",
        "name": "AMSTC - Association Médico-Sociale des Talibés Cheikh",
        "logo": { "@type": "ImageObject", "url": "https://amstc.org/assets/logo-mark-sm.png" }
      },
      "mainEntityOfPage": { "@type": "WebPage", "@id": window.location.href }
    };
    const script = document.createElement("script");
    script.type = "application/ld+json";
    script.textContent = JSON.stringify(schema);
    document.head.appendChild(script);
  }

  // Un contenu IMPORTÉ depuis un fichier HTML (assets/js/import-html.js)
  // arrive comme HTML complet, style compris, marqué par la classe
  // html-importe. Il ne passe pas par marked - qui casserait le <style> -
  // et DOMPurify reçoit les options qui laissent passer style et class.
  // Tout autre corps reste du Markdown, rendu comme avant.
  function rendreCorps(body) {
    const b = body || '';
    if (/^\s*(<style[\s>]|<div class="html-importe")/i.test(b) && typeof optionsPurifyImport === 'function') {
      return DOMPurify.sanitize(b, optionsPurifyImport());
    }
    return DOMPurify.sanitize(marked.parse(b));
  }

  async function loadArticle() {
    const slug = new URLSearchParams(window.location.search).get("slug");
    const content = document.getElementById("content");
    if (!slug) { content.innerHTML = "<p>Projet introuvable.</p>"; return; }
    try {
      const res = await fetch(
        `https://raw.githubusercontent.com/${REPO}/main/${FOLDER}/${slug}.md`
      );
      // Un slug inconnu renvoie 404 : sans ce test, le texte brut
      // « 404: Not Found » de GitHub s'affichait comme s'il etait le
      // contenu de la page. Le lecteur doit savoir que la page n'existe
      // pas, et ou aller.
      if (!res.ok) {
        document.title = "Projet introuvable - AMSTC";
        content.innerHTML = `<h1>Ce projet n'existe pas ou plus.</h1>
          <p>Le lien est peut-être ancien, ou le contenu a été retiré.</p>
          <p><a href="projets.html">Tous les projets &rarr;</a></p>`;
        return;
      }
      const raw = await res.text();
      const { data, body } = parseFrontMatter(raw);
      document.title = (data.title || "Projet") + " - AMSTC";
      document.getElementById('canonical').setAttribute('href', window.location.href);
      document.getElementById('og-url').setAttribute('content', window.location.href);
      if (data.title) {
        document.getElementById('og-title').setAttribute('content', data.title + ' - AMSTC');
      }
      if (data.excerpt) {
        document.getElementById('og-desc').setAttribute('content', data.excerpt);
      }
      injectArticleSchema(data, "Projets");
      const ytId = youtubeEmbedId(data.video_youtube);
      content.innerHTML = `
        <span class="art-date">${formatDatePeriode(data)}</span>
        ${data.statut ? `<span class="art-statut">${esc(data.statut)}</span>` : ""}
        <h1>${esc(data.title || '')}</h1>
        ${data.image ? `<img id="cover" src="${esc(data.image)}" style="display:block">` : ""}
        ${ytId ? `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${ytId}" title="Vidéo YouTube" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` : ""}
        <div id="body">${rendreCorps(body)}</div>
      `;
      if (typeof rendreSommaireDepliant === 'function') rendreSommaireDepliant(document.getElementById('body'));
      loadEtapes(slug);
    } catch (e) {
      content.innerHTML = "<p>Impossible de charger ce projet.</p>";
    }
  }

  async function loadEtapes(projetSlug) {
    try {
      const res = await fetch("content/etapes-index.json");
      if (!res.ok) return;
      const all = await res.json();
      const etapes = all
        .filter(e => e.projet === projetSlug)
        .sort((a, b) => {
          const oa = a.ordre === '' ? null : a.ordre;
          const ob = b.ordre === '' ? null : b.ordre;
          if (oa !== null && ob !== null && oa !== ob) return oa - ob;
          if (oa !== null && ob === null) return -1;
          if (oa === null && ob !== null) return 1;
          return new Date(a.date || 0) - new Date(b.date || 0);
        });
      if (etapes.length === 0) return;

      document.getElementById("etapes-timeline").innerHTML = etapes.map((e, i) => `
        <div class="etape-item">
          <div class="etape-dot">${i + 1}</div>
          <a class="etape-card" href="etape.html?slug=${encodeURIComponent(e.slug)}">
            <span class="etape-date">${formatDatePeriode(e)}</span>
            <h3>${esc(e.title || 'Sans titre')}</h3>
            <p>${esc(e.excerpt || '')}</p>
          </a>
        </div>
      `).join('');
      document.getElementById("etapes-section").style.display = "";
    } catch (e) { /* pas d'étapes disponibles, on continue sans */ }
  }

  loadArticle();
</script>
</body>
